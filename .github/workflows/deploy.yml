# 部署自动化（D-1）：手动触发，在目标机上跑 scripts/deploy.js。
#
# 为什么是 workflow_dispatch 而不是 push 自动跨越：
#   CI（ci.yml）负责“构建并推镜像”，但**推镜像不等于部署**——
#   上线时机、回滚决策、变更审批都是人的判断。把两者绑在一起，
#   会让“合并到 main”瞬间等于“生产已变”，而且没有回头路。
#   本流程把“何时上”交给人，把“怎么上”固化为脚本。
#
# 两种运行方式（按仓库密钥是否配置自动选择）：
#   A. 自托管 runner（推荐）：在部署机上注册带 `deploy` 标签的 runner。
#      部署机与仓库同机时最简单——无需管 SSH 凭据，也不会把部署密钥散到 Actions。
#   B. SSH：配 DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY / DEPLOY_PATH，在部署机上
#      拉取仓库到指定提交后跑同一个脚本。
#
# 安全套主要取：
#   - 强制经 GitHub Environment（production / staging），可在仓库设置里给它加**人工审批门**；
#   - 镜像必须是带版本 tag 的全名，正则校验后才会传给脚本（脚本自身也有一道）；
#   - 镜像先验签再部署：preflight 用 cosign keyless 验签（身份限本仓库 ci.yml），
#     并把 tag 解析成不可变 digest 后传给脚本——deployPolicy 的
#     DEPLOY_REQUIRE_DIGEST_PIN 闸在 deploy.js 侧拒绝一切非 digest 引用；
#   - 密钥不上命令行：SSH key 走 stdin，远程命令里只出现镜像名。
#
# ⚠️ 未验证声明：本流程**从未在 GitHub Actions 上真实跑过**
#   （本地无 GitHub 控制权，也无部署机）。结构与关键不变量已由
#   src/tests/deploy/deployWorkflow.test.js 做静态断言，命令拼装已抽成可单测的
#   scripts/deployCommands.js（--dry-run 打印真实 argv），但“能不能跑通”需首次配置后实践。
#   首次 dry_run=true 演练的步骤与留证表格见 deployment/deploy-workflow-rehearsal.md；
#   在该文件的记录表出现真实 run URL 之前，本声明继续有效。
name: 'Deploy'

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: '目标镜像（全名 + 版本 tag，如 ghcr.io/owner/repo:sha-abc1234）'
        required: true
        type: string
      environment:
        description: '部署环境（决定哪组密钥，并触发对应的人工审批门）'
        required: true
        type: choice
        options:
          - staging
          - production
      strategy:
        description: '发布策略：rolling=单色滚动（秒级中断）；hot=蓝绿升级（零停机，要求 nginx upstream 与宿主代理）'
        required: true
        type: choice
        options:
          - rolling
          - hot
        default: rolling
      dry_run:
        description: '干跑：只打印部署计划与判据，不做任何变更'
        required: false
        type: boolean
        default: false
      skip_backup:
        description: '跳过备份（仅演练用；真实发布不要勾）'
        required: false
        type: boolean
        default: false

# 工作流级仅 read-all；写权限一律下放到 job（与 scorecard.yml 同口径）
permissions:
  contents: read

# 同一环境同时只允许一个部署：deploy.js 的编排是
# 「备份 → 迁移 → 切镜像 → 健康门禁 → 失败自动回滚」，两次部署并发时会互相踩——
# A 的回滚目标可能是 B 刚切上去的新镜像，健康门禁也可能读到对方刚改写的容器。
# cancel-in-progress 必须为 false：部署跑到一半被取消会留下"迁移已执行、镜像未切换"
# 的半程状态，比排队更危险。
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # 第一道：把“输入合法性”与“部署凭据是否配好”提前查掉。
  # 单独成 job 是为了让失败发生在**任何环境交互之前**，与 deploy.js 的 exit 2 同意图。
  preflight:
    runs-on: ubuntu-latest
    # digest 解析（buildx imagetools inspect）与 cosign verify 都要读 registry：
    # GHCR 的包公开与否不定，显式给 packages:read，凭据只用本仓库 GITHUB_TOKEN。
    permissions:
      contents: read
      packages: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      image_tag: ${{ steps.validate.outputs.image_tag }}
      image_ref: ${{ steps.verify.outputs.image_ref }}
    steps:
      - name: Validate image tag format
        id: validate
        # 不接受缺参数、不接受本地开发默认值 fire-safety-app:local。
        # 与 scripts/deploy.js 的 validatePreflight 同判据（本地默认 tag 无法回答“线上是哪个 commit”）。
        #
        # 输入值必须经 env 进入脚本，不能写成 tag="${{ inputs.image_tag }}"：
        # `${{ }}` 是**文本级**替换，早于 shell 解析与这里的正则校验，
        # 一个 `x" && id && "` 形态的 tag 就能在这个持有部署凭据的 runner 上执行任意命令
        # （GitHub 官方 script injection 口径）。env 赋值不参与 shell 文本展开，才是安全通道。
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_IMAGE_TAG}"
          # 字符集必须收死：镜像引用随后要单引号包进远程命令
          # （APP_IMAGE='<tag>' node scripts/deploy.js）。仓库段曾写 `.+`，
          # 于是 a/x';id;':latest 能通过校验并在持有部署凭据的目标机上执行任意命令。
          # Docker 仓库段合法字符只有小写字母数字与 . _ - /，不含引号、空格、分号。
          if [[ ! "$tag" =~ ^[a-z0-9.-]+(:[0-9]+)?/[a-z0-9._-]+(/[a-z0-9._-]+)*:[A-Za-z0-9._-]+$ ]]; then
            echo "::error::镜像引用格式不合法（需为 registry/仓库:tag）：$tag"
            exit 1
          fi
          if [[ "$tag" == *":local" ]]; then
            echo "::error::不允许用 :local 标签发布（指向本机未版本化构建）：$tag"
            exit 1
          fi
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR (digest 解析需要读权限)
        if: startsWith(steps.validate.outputs.image_tag, 'ghcr.io/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # ===== 镜像验签闭环（此前全链路只签不验）=====
      # ci.yml 的 build job 只签（cosign sign），cosign verify 此前只存在于注释，
      # 部署链路 pull 前不验签也不比 digest——任何能覆盖 :sha-xxxx 标签的主体
      # 都能让生产跑未签名镜像，cosign + SLSA + SBOM 的投入防护值≈0。
      # 本步骤把验签接进部署链，且验的是**不可变 digest**：
      #   ① 先把 tag 解析成 digest（验 tag 再 pull tag 有 TOCTOU：两次解析之间
      #      tag 可被覆盖；digest 在 registry 端不可变，锚定后覆盖标签无意义）；
      #   ② keyless 验签：证书身份必须是本仓库 ci.yml 的工作流 ref，OIDC issuer
      #      必须是 GitHub Actions——其他身份（含 fork 仓库同名工作流）一律拒绝；
      #   ③ 把 <repo>@sha256:… 传给两条部署路径：deploy.js 全程只 pull/up 这个引用
      #      （deployPolicy 侧另有 DEPLOY_REQUIRE_DIGEST_PIN 闸兜底）。
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Resolve digest and verify signature (keyless)
        id: verify
        env:
          IMAGE_TAG: ${{ steps.validate.outputs.image_tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # ① 解析 digest：.Manifest.Digest 即该 tag 当前指向的顶层清单摘要，
          #    与 ci.yml 签名时用的 push.outputs.digest 同源（都是 manifest digest）。
          digest="$(docker buildx imagetools inspect "$IMAGE_TAG" --format '{{.Manifest.Digest}}')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::未能把镜像引用解析出合法 digest（得到：「$digest」）"
            exit 1
          fi
          image_ref="${IMAGE_TAG}@${digest}"
          # ② keyless 验签。仓库段要转义点号：org.name 形态不转义会把
          #    regexp 的 . 放宽成"任意字符"，信任面多开一档。
          repo_rx="$(printf '%s' "$GITHUB_REPOSITORY" | sed 's/[.]/[.]/g')"
          identity_rx="^https://github.com/${repo_rx}/\.github/workflows/ci\.yml@"
          cosign verify "$image_ref" \
            --certificate-identity-regexp "$identity_rx" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"

      # ===== 合规就绪度（严格档）为什么**不在**这里 =====
      # 严格档要在它声称要拦的位置兑现，但那个位置不是 preflight：
      #   ① 本 job 没有 actions/checkout：runner 上不存在 scripts/，任何 node scripts/…
      #      都必然 ENOENT ⇒ 这道 step 一加就恒红（第 19 轮 r19-f lane 在空工作区复刻实测
      #      `Cannot find module …\scripts\compliance-check.js`，RC=1）。
      #   ② 就算补上 checkout 也过不了：严格档读 logs/alert-probe.json（complianceVerdicts
      #      :222 的硬编码路径），该文件由 alert-delivery-probe.js 在**能连 alertmanager 的
      #      那台机器**上写出，且 logs/ 被 .gitignore 整体忽略 ⇒ hosted runner 的干净 checkout
      #      上必然 missing ⇒ 恒 notReady（实测：给足所有 secret 仍 RC=1，
      #      notReady=["告警投递探针 (alertmanager)"]）。
      # 结论：严格档必须在**部署主机侧**执行（仓库副本在、探针记录可能在），见下面两个
      # job 里的 "Compliance readiness (strict)"。判据由 src/tests/deploy/deployWorkflow.test.js
      # 钉住：preflight 出现 COMPLIANCE_STRICT 即红。

      - name: Detect deploy credentials
        id: mode
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        # fail-closed：两种模式都不成立时**拒绝执行**，
        # 而不是“没配密钥就跳过部署并报绿”——后者会让人以为已发布。
        run: |
          set -euo pipefail
          if [[ -n "${DEPLOY_HOST:-}" && -n "${DEPLOY_SSH_KEY:-}" ]]; then
            # 2026-10-24 审计 P2：主机密钥是 SSH 模式的必要条件，不是“建议”。
            # 未配置时旧实现只 warning 并退回 accept-new（TOFU）——首次见到的
            # 密钥被无条件信任，中间人可冒充部署主机、截获部署命令与配置。
            # 这里在**任何环境交互之前**拒绝，避免走到部署 job 才发现。
            if [[ -z "${DEPLOY_KNOWN_HOSTS:-}" ]]; then
              echo "::error::SSH 模式必须配置 DEPLOY_KNOWN_HOSTS（部署主机公钥）；拒绝以 TOFU 模式连接。"
              exit 1
            fi
            echo "mode=ssh" >> "$GITHUB_OUTPUT"
            echo "部署方式：SSH（DEPLOY_HOST 已配置）"
            exit 0
          fi
          echo "mode=self-hosted" >> "$GITHUB_OUTPUT"
          echo "部署方式：自托管 runner（未配 SSH 密钥，将在带 deploy 标签的 runner 上执行）"
          echo "::warning::未配置 DEPLOY_HOST/DEPLOY_SSH_KEY：若仓库也没有自托管 runner，本次部署将停在“等 runner”上。"

  # 模式 A：自托管 runner（部署机上已注册，标签 deploy）
  deploy-self-hosted:
    needs: preflight
    if: needs.preflight.outputs.mode == 'self-hosted'
    runs-on: [self-hosted, deploy]
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout (clean deployment workspace)
        # persist-credentials: false：不把 GITHUB_TOKEN 留在部署机的 .git/config
        # （部署不需要 git push；SHA 钉版与仓库「钉 digest」标准一致）。
        # 密钥通过 FSMS_SECRETS_DIR 指向 checkout 目录之外，工作树可以安全清理，
        # 旧的未跟踪文件不会跨版本残留并参与部署。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      # ===== 合规就绪度（严格档）=====
      # scripts/compliance-check.js 的严格档本来就只为部署门禁设计（见该文件 :490-497 与
      # complianceVerdicts.js:80/172），但它的证据**只可能存在于部署主机**：保留期/RPO/
      # SIEM 要走 secrets，告警探针记录 logs/alert-probe.json 又由 alert-delivery-probe.js
      # 在这台机器上写出（logs/ 被 .gitignore 忽略，hosted runner 上必然 missing）。
      # 所以这道闸放在主机侧、checkout 之后、任何环境交互之前——与 check-clock-sync.js 同层。
      # 不配置即 notReady ⇒ 拦；"治理没开就上线"正是要拦的那件事。
      - name: Compliance readiness (strict — blocks deploy when governance is off)
        env:
          COMPLIANCE_STRICT: '1'
          # 生产闸：占位 webhook 在本档即红（compliance-alerting.js:88 的口径）
          ALERT_WEBHOOK_CHECK: production
          BUSINESS_RETENTION_DAYS_FIRE_ALARM: ${{ secrets.BUSINESS_RETENTION_DAYS_FIRE_ALARM }}
          BUSINESS_RETENTION_DAYS_INSPECTION: ${{ secrets.BUSINESS_RETENTION_DAYS_INSPECTION }}
          BUSINESS_RETENTION_DAYS_FIRE_DEVICE: ${{ secrets.BUSINESS_RETENTION_DAYS_FIRE_DEVICE }}
          BUSINESS_RETENTION_DAYS_USER: ${{ secrets.BUSINESS_RETENTION_DAYS_USER }}
          BUSINESS_RETENTION_DAYS_FORENSIC_CAPTURE: ${{ secrets.BUSINESS_RETENTION_DAYS_FORENSIC_CAPTURE }}
          BACKUP_RPO_HOURS: ${{ secrets.BACKUP_RPO_HOURS }}
          BACKUP_RTO_HOURS: ${{ secrets.BACKUP_RTO_HOURS }}
          LOG_SHIPPING_URL: ${{ secrets.LOG_SHIPPING_URL }}
          # 探针记录不在仓库里时的落点（宿主机绝对路径）；不配则用仓库相对默认值
          ALERT_PROBE_RECORD_PATH: ${{ secrets.ALERT_PROBE_RECORD_PATH }}
        run: node scripts/compliance-check.js

      # 直接调脚本：备份 / 迁移 / 切换 / 健康门禁 / 失败回滚全在脚本内，
      # 工作流不重复实现一遍判据（否则两处逻辑会漂移）。
      - name: Run deploy.js
        env:
          # digest 钉死引用（preflight 验签 + 解析的产物），不是输入的原始 tag：
          # 验签与 pull 落在同一份不可变内容上，标签此后被覆盖影响不到本次发布。
          APP_IMAGE: ${{ needs.preflight.outputs.image_ref }}
          # 最后一道闸：deploy.js 侧拒绝一切非 digest 引用（含误配直传 tag）
          DEPLOY_REQUIRE_DIGEST_PIN: 'true'
          # 必须指向 checkout 目录之外的宿主机密钥目录；缺失时 deploy.js 前置校验失败。
          FSMS_SECRETS_DIR: ${{ secrets.FSMS_SECRETS_DIR }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          # compose 用 `${ALLOWED_HOSTS:?}` 强制显式声明，缺它会在"切换"那步才被拒
          # （此前只下发 CORS_ORIGIN ⇒ 前置校验通过、切换时才炸）。见 deployWorkflow 自检。
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
          # 2026-10-24 审计：compose 用 `${TRUSTED_PROXY_CIDRS:?...}` 强制显式声明——
          # 默认留空会让代理判据静默退回兼容档。与 ALLOWED_HOSTS 同口径下发。
          TRUSTED_PROXY_CIDRS: ${{ secrets.TRUSTED_PROXY_CIDRS }}
          # O-1：deployPolicy 的发布前置校验强制要求这两项显式给值——缺了会在
          # validatePreflight 阶段以退出码 2 拒绝（此前工作流从未下发，按文档执行必失败）。
          BACKUP_RPO_HOURS: ${{ secrets.BACKUP_RPO_HOURS }}
          BACKUP_RTO_HOURS: ${{ secrets.BACKUP_RTO_HOURS }}
          # P1-4：生产发布强制异地备份；CMD 与 DIR 任选其一（CMD 优先）
          DEPLOY_ENFORCE_OFFSITE: 'true'
          BACKUP_REQUIRE_OFFSITE: 'true'
          BACKUP_OFFSITE_CMD: ${{ secrets.BACKUP_OFFSITE_CMD }}
          BACKUP_OFFSITE_DIR: ${{ secrets.BACKUP_OFFSITE_DIR }}
          # 告警接收端真实配置（私有副本路径）。不配则 deployPolicy 读仓库内占位模板
          # 并 fail-closed；演练环境可显式允许占位（S-5）。
          ALERTMANAGER_CONFIG_PATH: ${{ secrets.ALERTMANAGER_CONFIG_PATH }}
          ALLOW_PLACEHOLDER_ALERT_WEBHOOK: ${{ secrets.ALLOW_PLACEHOLDER_ALERT_WEBHOOK }}
          # 两个开关同样走 env：本文件的规定是 run 脚本里零 `${{ }}` 文本插值
          DRY_RUN: ${{ inputs.dry_run }}
          SKIP_BACKUP: ${{ inputs.skip_backup }}
          # 发布策略与升级参数：同样只经 env 进入脚本
          DEPLOY_STRATEGY: ${{ inputs.strategy }}
          HOT_UPGRADE_NGINX_CONF: ${{ secrets.HOT_UPGRADE_NGINX_CONF }}
          HOT_UPGRADE_REGISTRY_ALLOWLIST: ${{ secrets.HOT_UPGRADE_REGISTRY_ALLOWLIST }}
        run: |
          set -euo pipefail
          # P1-5：正式发布前证明宿主时钟已同步（dry-run 不执行只出计划）
          if [[ "$DRY_RUN" != "true" ]]; then
            node scripts/check-clock-sync.js
          fi
          args=()
          [[ "$DRY_RUN" == "true" ]] && args+=(--dry-run)
          [[ "$SKIP_BACKUP" == "true" ]] && args+=(--skip-backup)
          if [[ "$DEPLOY_STRATEGY" == "hot" ]]; then
            # 升级自带备份，且失败要靠旧色回滚；跳备份等于放弃回滚抓手
            if [[ "$SKIP_BACKUP" == "true" ]]; then
              echo "::error::hot 策略不支持 skip_backup（回滚依赖升级前备份）"
              exit 1
            fi
            if [[ -z "${HOT_UPGRADE_NGINX_CONF:-}" ]]; then
              echo "::error::hot 策略必须配置 secret HOT_UPGRADE_NGINX_CONF（含 upstream fsms_app 的 nginx 主配置）"
              exit 1
            fi
            if [[ -z "${HOT_UPGRADE_REGISTRY_ALLOWLIST:-}" ]]; then
              echo "::error::hot 策略必须配置 secret HOT_UPGRADE_REGISTRY_ALLOWLIST（空白名单按全拒处理）"
              exit 1
            fi
            hot_args=(--nginx-conf "$HOT_UPGRADE_NGINX_CONF")
            [[ "$DRY_RUN" == "true" ]] && hot_args+=(--dry-run)
            # 缺 --apply 时 hotUpgrade.js 走演练分支并以 2 退出：CI 会「成功打印了计划」，
            # 而线上什么都没变。这个分支是发布路径，非法演练必须显式 --dry-run。
            [[ "$DRY_RUN" == "true" ]] || hot_args+=(--apply)
            HOT_UPGRADE_IMAGE="$APP_IMAGE" node scripts/hotUpgrade.js "${hot_args[@]}"
          else
            node scripts/deploy.js "${args[@]}"
          fi

  # 模式 B：SSH（部署机上有仓库副本，通过 DEPLOY_PATH 指定）
  deploy-ssh:
    needs: preflight
    if: needs.preflight.outputs.mode == 'ssh'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          FSMS_SECRETS_DIR: ${{ secrets.FSMS_SECRETS_DIR }}
        # 密钥走 stdin 写入，不出现在命令行（命令行会进进程列表）。
        # known_hosts **必选且 fail-closed**：旧实现在未配置时只 warning 并退回
        # accept-new（TOFU），首次见到的密钥被无条件信任。现在缺少即失败，
        # 只允许 StrictHostKeyChecking=yes。
        run: |
          set -euo pipefail
          # 三个 secret 随后都要拼进 ssh：DEPLOY_PATH 落在远程命令的**单引号**里
          # （cd '<path>'），DEPLOY_USER/DEPLOY_HOST 落在 `user@host` 这一个 argv 里。
          # 前者含 `'` 即可闭合单引号、在持有部署凭据的目标机上执行任意命令
          # （与已收口的镜像名闸同型：仓库段曾是 `.+`）；后者为空或含空格会让 ssh
          # 把 argv 当选项解析（-oProxyCommand=… 直接在本 runner 上执行命令）。
          # secret 只有仓库管理员能设，但部署机凭据不该依赖"管理员不会写错"。
          # 一次性在这里判掉（放在唯一一处，避免同一规则两处各写一份而漂移）：
          # 不写密钥、不连主机就先失败，避免半程状态。
          if [[ ! "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::DEPLOY_PATH 必须是不含空格/引号的绝对路径（仅 [A-Za-z0-9._/-]；不支持带空格的 IPv6/路径写法）：$DEPLOY_PATH"
            exit 1
          fi
          if [[ ! "$DEPLOY_USER" =~ ^[A-Za-z0-9._][A-Za-z0-9._-]*$ ]]; then
            echo "::error::DEPLOY_USER 非法（必须非空、不以 - 开头、仅含 [A-Za-z0-9._-]，不得含空格或 @）"
            exit 1
          fi
          if [[ ! "$DEPLOY_HOST" =~ ^[A-Za-z0-9._][A-Za-z0-9._-]*$ ]]; then
            echo "::error::DEPLOY_HOST 非法（必须非空、不以 - 开头、仅含 [A-Za-z0-9._-]；IPv6 字面量请改用主机名）"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [[ -z "${DEPLOY_KNOWN_HOSTS:-}" ]]; then
            echo "::error::DEPLOY_KNOWN_HOSTS 为空：拒绝以 TOFU（accept-new）模式连接部署主机。"
            exit 1
          fi
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh_opts=(-o StrictHostKeyChecking=yes)
          # 失败则连接层就会拒绝（fail-closed）
          ssh "${ssh_opts[@]}" -i ~/.ssh/id_deploy -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" -- echo "ssh ok"

      - name: Run deploy.js on the host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          FSMS_SECRETS_DIR: ${{ secrets.FSMS_SECRETS_DIR }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          # 与 self-hosted 路径同口径：compose 的 `:?` 要求两条部署路径都下发
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
          TRUSTED_PROXY_CIDRS: ${{ secrets.TRUSTED_PROXY_CIDRS }}
          # O-1：与 self-hosted 同口径，RPO/RTO 缺一即在前置校验被拒
          BACKUP_RPO_HOURS: ${{ secrets.BACKUP_RPO_HOURS }}
          BACKUP_RTO_HOURS: ${{ secrets.BACKUP_RTO_HOURS }}
          # P1-4：与 self-hosted 同口径；下面经 printf %q 写入远程脚本
          DEPLOY_ENFORCE_OFFSITE: 'true'
          BACKUP_REQUIRE_OFFSITE: 'true'
          BACKUP_OFFSITE_CMD: ${{ secrets.BACKUP_OFFSITE_CMD }}
          BACKUP_OFFSITE_DIR: ${{ secrets.BACKUP_OFFSITE_DIR }}
          ALERTMANAGER_CONFIG_PATH: ${{ secrets.ALERTMANAGER_CONFIG_PATH }}
          ALLOW_PLACEHOLDER_ALERT_WEBHOOK: ${{ secrets.ALLOW_PLACEHOLDER_ALERT_WEBHOOK }}
          # 合规严格档（在目标机上跑）所需的声明口径与探针记录落点：
          # 与 self-hosted 路径同源，缺任一项在本地 printf 的 ${:?} 处就失败。
          BUSINESS_RETENTION_DAYS_FIRE_ALARM: ${{ secrets.BUSINESS_RETENTION_DAYS_FIRE_ALARM }}
          BUSINESS_RETENTION_DAYS_INSPECTION: ${{ secrets.BUSINESS_RETENTION_DAYS_INSPECTION }}
          BUSINESS_RETENTION_DAYS_FIRE_DEVICE: ${{ secrets.BUSINESS_RETENTION_DAYS_FIRE_DEVICE }}
          BUSINESS_RETENTION_DAYS_USER: ${{ secrets.BUSINESS_RETENTION_DAYS_USER }}
          BUSINESS_RETENTION_DAYS_FORENSIC_CAPTURE: ${{ secrets.BUSINESS_RETENTION_DAYS_FORENSIC_CAPTURE }}
          LOG_SHIPPING_URL: ${{ secrets.LOG_SHIPPING_URL }}
          ALERT_PROBE_RECORD_PATH: ${{ secrets.ALERT_PROBE_RECORD_PATH }}
          IMAGE_TAG: ${{ needs.preflight.outputs.image_ref }}
          # 与 self-hosted 同口径：deploy.js 侧拒绝非 digest 引用。
          # 注意这份 env 只到本 runner 为止，目标机上的 deploy.js 看不见它——
          # 真正生效靠下一步把它写进经 stdin 交付的远程脚本（`${:?}` 漏配即报错，
          # 不静默展开成空串）。
          DEPLOY_REQUIRE_DIGEST_PIN: 'true'
          DRY_RUN: ${{ inputs.dry_run }}
          SKIP_BACKUP: ${{ inputs.skip_backup }}
          DEPLOY_STRATEGY: ${{ inputs.strategy }}
          HOT_UPGRADE_NGINX_CONF: ${{ secrets.HOT_UPGRADE_NGINX_CONF }}
          HOT_UPGRADE_REGISTRY_ALLOWLIST: ${{ secrets.HOT_UPGRADE_REGISTRY_ALLOWLIST }}
        run: |
          set -euo pipefail
          extra=""
          [[ "$DRY_RUN" == "true" ]] && extra="$extra --dry-run"
          [[ "$SKIP_BACKUP" == "true" ]] && extra="$extra --skip-backup"
          hot_extra=""
          if [[ "$DRY_RUN" == "true" ]]; then hot_extra=" --dry-run"; else hot_extra=" --apply"; fi
          if [[ "$DEPLOY_STRATEGY" == "hot" ]]; then
            if [[ "$SKIP_BACKUP" == "true" ]]; then
              echo "::error::hot 策略不支持 skip_backup（回滚依赖升级前备份）"
              exit 1
            fi
            if [[ -z "${HOT_UPGRADE_NGINX_CONF:-}" ]]; then
              echo "::error::hot 策略必须配置 secret HOT_UPGRADE_NGINX_CONF"
              exit 1
            fi
            if [[ -z "${HOT_UPGRADE_REGISTRY_ALLOWLIST:-}" ]]; then
              echo "::error::hot 策略必须配置 secret HOT_UPGRADE_REGISTRY_ALLOWLIST"
              exit 1
            fi
          fi
          # O-1：远程环境改经 **stdin 脚本**交付，不再依赖 `ssh -o SendEnv` 通道——
          # SendEnv 只在目标机 sshd 显式 AcceptEnv 该变量名时才生效（默认只放行
          # LANG/LC_*），此前 CORS_ORIGIN/ALLOWED_HOSTS 实际从未到达目标机，
          # DEPLOY_REQUIRE_DIGEST_PIN 也只能拼进命令串。
          # 现在所有变量都由 printf %q 生成可安全回读的 shell 字面量后写入脚本，
          # 整个脚本经管道送进远程 `bash -s`：既不出现在 argv / 进程列表，
          # 也不再要求目标机配置 AcceptEnv。`${var:?}` 保证漏配时在本地立即失败，
          # 而不是把空串送给 deploy.js 让门禁读成"关"。
          ssh_opts=(-o StrictHostKeyChecking=yes)
          {
            # 远程脚本此前只 cd + node scripts/deploy.js：部署机上的仓库副本可以是
            # 任意旧版本，digest/回滚/健康门禁逻辑会静默使用旧实现。先把工作树钉到
            # 本次工作流对应的提交，fetch/checkout 失败即中止（set -e）。
            printf 'set -euo pipefail\n'
            printf 'cd %q\n' "$DEPLOY_PATH"
            printf 'git fetch --prune origin %q\n' "$GITHUB_REF"
            printf 'git checkout --detach %q\n' "$GITHUB_SHA"
            printf 'export APP_IMAGE=%q\n' "$IMAGE_TAG"
            printf 'export DEPLOY_REQUIRE_DIGEST_PIN=%q\n' "${DEPLOY_REQUIRE_DIGEST_PIN:?deploy-ssh 未下发 digest 钉死闸}"
            printf 'export FSMS_SECRETS_DIR=%q\n' "${FSMS_SECRETS_DIR:?deploy-ssh 未下发 FSMS_SECRETS_DIR}"
            printf 'export CORS_ORIGIN=%q\n' "${CORS_ORIGIN:?deploy-ssh 未下发 CORS_ORIGIN}"
            printf 'export ALLOWED_HOSTS=%q\n' "${ALLOWED_HOSTS:?deploy-ssh 未下发 ALLOWED_HOSTS}"
            printf 'export TRUSTED_PROXY_CIDRS=%q\n' "${TRUSTED_PROXY_CIDRS:?deploy-ssh 未下发 TRUSTED_PROXY_CIDRS}"
            printf 'export BACKUP_RPO_HOURS=%q\n' "${BACKUP_RPO_HOURS:?deploy-ssh 未下发 BACKUP_RPO_HOURS}"
            printf 'export BACKUP_RTO_HOURS=%q\n' "${BACKUP_RTO_HOURS:?deploy-ssh 未下发 BACKUP_RTO_HOURS}"
            printf 'export DEPLOY_ENFORCE_OFFSITE=%q\n' "${DEPLOY_ENFORCE_OFFSITE:?deploy-ssh 未下发 DEPLOY_ENFORCE_OFFSITE}"
            printf 'export BACKUP_REQUIRE_OFFSITE=%q\n' "${BACKUP_REQUIRE_OFFSITE:?deploy-ssh 未下发 BACKUP_REQUIRE_OFFSITE}"
            if [[ -n "${BACKUP_OFFSITE_CMD:-}" ]]; then
              printf 'export BACKUP_OFFSITE_CMD=%q\n' "$BACKUP_OFFSITE_CMD"
            fi
            if [[ -n "${BACKUP_OFFSITE_DIR:-}" ]]; then
              printf 'export BACKUP_OFFSITE_DIR=%q\n' "$BACKUP_OFFSITE_DIR"
            fi
            printf 'export DEPLOY_STRATEGY=%q\n' "${DEPLOY_STRATEGY:?deploy-ssh 未下发 DEPLOY_STRATEGY}"
            if [[ "$DEPLOY_STRATEGY" == "hot" ]]; then
              printf 'export HOT_UPGRADE_NGINX_CONF=%q\n' "${HOT_UPGRADE_NGINX_CONF:?hot 策略未下发 HOT_UPGRADE_NGINX_CONF}"
              printf 'export HOT_UPGRADE_REGISTRY_ALLOWLIST=%q\n' "${HOT_UPGRADE_REGISTRY_ALLOWLIST:?hot 策略未下发 HOT_UPGRADE_REGISTRY_ALLOWLIST}"
            fi
            if [[ -n "${ALERTMANAGER_CONFIG_PATH:-}" ]]; then
              printf 'export ALERTMANAGER_CONFIG_PATH=%q\n' "$ALERTMANAGER_CONFIG_PATH"
            fi
            # 合规严格档：与 self-hosted 路径同口径，在**目标机**上执行（探针记录只可能在
            # 跑容器那台机器上；hosted runner 的干净 checkout 里必然 missing）。
            printf 'export COMPLIANCE_STRICT=%q\n' '1'
            printf 'export ALERT_WEBHOOK_CHECK=%q\n' 'production'
            printf 'export BUSINESS_RETENTION_DAYS_FIRE_ALARM=%q\n' "${BUSINESS_RETENTION_DAYS_FIRE_ALARM:?deploy-ssh 未下发 BUSINESS_RETENTION_DAYS_FIRE_ALARM}"
            printf 'export BUSINESS_RETENTION_DAYS_INSPECTION=%q\n' "${BUSINESS_RETENTION_DAYS_INSPECTION:?deploy-ssh 未下发 BUSINESS_RETENTION_DAYS_INSPECTION}"
            printf 'export BUSINESS_RETENTION_DAYS_FIRE_DEVICE=%q\n' "${BUSINESS_RETENTION_DAYS_FIRE_DEVICE:?deploy-ssh 未下发 BUSINESS_RETENTION_DAYS_FIRE_DEVICE}"
            printf 'export BUSINESS_RETENTION_DAYS_USER=%q\n' "${BUSINESS_RETENTION_DAYS_USER:?deploy-ssh 未下发 BUSINESS_RETENTION_DAYS_USER}"
            printf 'export BUSINESS_RETENTION_DAYS_FORENSIC_CAPTURE=%q\n' "${BUSINESS_RETENTION_DAYS_FORENSIC_CAPTURE:?deploy-ssh 未下发 BUSINESS_RETENTION_DAYS_FORENSIC_CAPTURE}"
            if [[ -n "${LOG_SHIPPING_URL:-}" ]]; then
              printf 'export LOG_SHIPPING_URL=%q\n' "$LOG_SHIPPING_URL"
            fi
            if [[ -n "${ALERT_PROBE_RECORD_PATH:-}" ]]; then
              printf 'export ALERT_PROBE_RECORD_PATH=%q\n' "$ALERT_PROBE_RECORD_PATH"
            fi
            printf 'node scripts/compliance-check.js\n'
            if [[ -n "${ALLOW_PLACEHOLDER_ALERT_WEBHOOK:-}" ]]; then
              printf 'export ALLOW_PLACEHOLDER_ALERT_WEBHOOK=%q\n' "$ALLOW_PLACEHOLDER_ALERT_WEBHOOK"
            fi
            # P1-5：在目标机（真正跑容器的那台）检查宿主时钟，dry-run 跳过
            # DRY_RUN 也走 %q（审计 2026-11-02 D-F2）：与同段其余变量同一纪律——
            # 当前它是 boolean 输入无注入面，但改成 string 输入/透传上游变量时
            # 这里就是与镜像名同型的注入点，口径先收齐。
            printf 'if [[ %q != "true" ]]; then node scripts/check-clock-sync.js; fi\n' "$DRY_RUN"
            # 策略分支留在目标机上执行：两条命令的固定 argv 由 deployCommands.js
            # 的单元测试把守，这里不重复实现部署判据。
            printf 'if [[ "$DEPLOY_STRATEGY" == "hot" ]]; then\n'
            printf '  HOT_UPGRADE_IMAGE="$APP_IMAGE" node scripts/hotUpgrade.js --nginx-conf "$HOT_UPGRADE_NGINX_CONF"%s\n' "$hot_extra"
            printf 'else\n'
            printf '  node scripts/deploy.js %s\n' "$extra"
            printf 'fi\n'
          } | ssh "${ssh_opts[@]}" -i ~/.ssh/id_deploy -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s'
