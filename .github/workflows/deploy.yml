# 部署自动化（D-1）：手动触发，在目标机上跑 scripts/deploy.js。
#
# 为什么是 workflow_dispatch 而不是 push 自动跨越：
#   CI（ci.yml）负责“构建并推镜像”，但**推镜像不等于部署**——
#   上线时机、回滚决策、变更审批都是人的判断。把两者绑在一起，
#   会让“合并到 main”瞬间等于“生产已变”，而且没有回头路。
#   本流程把“何时上”交给人，把“怎么上”固化为脚本。
#
# 两种运行方式（按仓库密钥是否配置自动选择）：
#   A. 自托管 runner（推荐）：在部署机上注册带 `deploy` 标签的 runner。
#      部署机与仓库同机时最简单——无需管 SSH 凭据，也不会把部署密钥散到 Actions。
#   B. SSH：配 DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY / DEPLOY_PATH，在部署机上
#      拉取仓库到指定提交后跑同一个脚本。
#
# 安全套主要取：
#   - 强制经 GitHub Environment（production / staging），可在仓库设置里给它加**人工审批门**；
#   - 镜像必须是带版本 tag 的全名，正则校验后才会传给脚本（脚本自身也有一道）；
#   - 镜像先验签再部署：preflight 用 cosign keyless 验签（身份限本仓库 ci.yml），
#     并把 tag 解析成不可变 digest 后传给脚本——deployPolicy 的
#     DEPLOY_REQUIRE_DIGEST_PIN 闸在 deploy.js 侧拒绝一切非 digest 引用；
#   - 密钥不上命令行：SSH key 走 stdin，远程命令里只出现镜像名。
#
# ⚠️ 未验证声明：本流程**从未在 GitHub Actions 上真实跑过**
#   （本地无 GitHub 控制权，也无部署机）。结构与关键不变量已由
#   src/tests/deploy/deployWorkflow.test.js 做静态断言，但“能不能跑通”需首次配置后实践。
name: 'Deploy'

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: '目标镜像（全名 + 版本 tag，如 ghcr.io/owner/repo:sha-abc1234）'
        required: true
        type: string
      environment:
        description: '部署环境（决定哪组密钥，并触发对应的人工审批门）'
        required: true
        type: choice
        options:
          - staging
          - production
      dry_run:
        description: '干跑：只打印部署计划与判据，不做任何变更'
        required: false
        type: boolean
        default: false
      skip_backup:
        description: '跳过备份（仅演练用；真实发布不要勾）'
        required: false
        type: boolean
        default: false

# 工作流级仅 read-all；写权限一律下放到 job（与 scorecard.yml 同口径）
permissions:
  contents: read

# 同一环境同时只允许一个部署：deploy.js 的编排是
# 「备份 → 迁移 → 切镜像 → 健康门禁 → 失败自动回滚」，两次部署并发时会互相踩——
# A 的回滚目标可能是 B 刚切上去的新镜像，健康门禁也可能读到对方刚改写的容器。
# cancel-in-progress 必须为 false：部署跑到一半被取消会留下"迁移已执行、镜像未切换"
# 的半程状态，比排队更危险。
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # 第一道：把“输入合法性”与“部署凭据是否配好”提前查掉。
  # 单独成 job 是为了让失败发生在**任何环境交互之前**，与 deploy.js 的 exit 2 同意图。
  preflight:
    runs-on: ubuntu-latest
    # digest 解析（buildx imagetools inspect）与 cosign verify 都要读 registry：
    # GHCR 的包公开与否不定，显式给 packages:read，凭据只用本仓库 GITHUB_TOKEN。
    permissions:
      contents: read
      packages: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      image_tag: ${{ steps.validate.outputs.image_tag }}
      image_ref: ${{ steps.verify.outputs.image_ref }}
    steps:
      - name: Validate image tag format
        id: validate
        # 不接受缺参数、不接受本地开发默认值 fire-safety-app:local。
        # 与 scripts/deploy.js 的 validatePreflight 同判据（本地默认 tag 无法回答“线上是哪个 commit”）。
        #
        # 输入值必须经 env 进入脚本，不能写成 tag="${{ inputs.image_tag }}"：
        # `${{ }}` 是**文本级**替换，早于 shell 解析与这里的正则校验，
        # 一个 `x" && id && "` 形态的 tag 就能在这个持有部署凭据的 runner 上执行任意命令
        # （GitHub 官方 script injection 口径）。env 赋值不参与 shell 文本展开，才是安全通道。
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_IMAGE_TAG}"
          # 字符集必须收死：镜像引用随后要单引号包进远程命令
          # （APP_IMAGE='<tag>' node scripts/deploy.js）。仓库段曾写 `.+`，
          # 于是 a/x';id;':latest 能通过校验并在持有部署凭据的目标机上执行任意命令。
          # Docker 仓库段合法字符只有小写字母数字与 . _ - /，不含引号、空格、分号。
          if [[ ! "$tag" =~ ^[a-z0-9.-]+(:[0-9]+)?/[a-z0-9._-]+(/[a-z0-9._-]+)*:[A-Za-z0-9._-]+$ ]]; then
            echo "::error::镜像引用格式不合法（需为 registry/仓库:tag）：$tag"
            exit 1
          fi
          if [[ "$tag" == *":local" ]]; then
            echo "::error::不允许用 :local 标签发布（指向本机未版本化构建）：$tag"
            exit 1
          fi
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR (digest 解析需要读权限)
        if: startsWith(steps.validate.outputs.image_tag, 'ghcr.io/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # ===== 镜像验签闭环（此前全链路只签不验）=====
      # ci.yml 的 build job 只签（cosign sign），cosign verify 此前只存在于注释，
      # 部署链路 pull 前不验签也不比 digest——任何能覆盖 :sha-xxxx 标签的主体
      # 都能让生产跑未签名镜像，cosign + SLSA + SBOM 的投入防护值≈0。
      # 本步骤把验签接进部署链，且验的是**不可变 digest**：
      #   ① 先把 tag 解析成 digest（验 tag 再 pull tag 有 TOCTOU：两次解析之间
      #      tag 可被覆盖；digest 在 registry 端不可变，锚定后覆盖标签无意义）；
      #   ② keyless 验签：证书身份必须是本仓库 ci.yml 的工作流 ref，OIDC issuer
      #      必须是 GitHub Actions——其他身份（含 fork 仓库同名工作流）一律拒绝；
      #   ③ 把 <repo>@sha256:… 传给两条部署路径：deploy.js 全程只 pull/up 这个引用
      #      （deployPolicy 侧另有 DEPLOY_REQUIRE_DIGEST_PIN 闸兜底）。
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Resolve digest and verify signature (keyless)
        id: verify
        env:
          IMAGE_TAG: ${{ steps.validate.outputs.image_tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # ① 解析 digest：.Manifest.Digest 即该 tag 当前指向的顶层清单摘要，
          #    与 ci.yml 签名时用的 push.outputs.digest 同源（都是 manifest digest）。
          digest="$(docker buildx imagetools inspect "$IMAGE_TAG" --format '{{.Manifest.Digest}}')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::未能把镜像引用解析出合法 digest（得到：「$digest」）"
            exit 1
          fi
          image_ref="${IMAGE_TAG}@${digest}"
          # ② keyless 验签。仓库段要转义点号：org.name 形态不转义会把
          #    regexp 的 . 放宽成"任意字符"，信任面多开一档。
          repo_rx="$(printf '%s' "$GITHUB_REPOSITORY" | sed 's/[.]/[.]/g')"
          identity_rx="^https://github.com/${repo_rx}/\.github/workflows/ci\.yml@"
          cosign verify "$image_ref" \
            --certificate-identity-regexp "$identity_rx" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"

      - name: Detect deploy credentials
        id: mode
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        # fail-closed：两种模式都不成立时**拒绝执行**，
        # 而不是“没配密钥就跳过部署并报绿”——后者会让人以为已发布。
        run: |
          set -euo pipefail
          if [[ -n "${DEPLOY_HOST:-}" && -n "${DEPLOY_SSH_KEY:-}" ]]; then
            echo "mode=ssh" >> "$GITHUB_OUTPUT"
            echo "部署方式：SSH（DEPLOY_HOST 已配置）"
            exit 0
          fi
          echo "mode=self-hosted" >> "$GITHUB_OUTPUT"
          echo "部署方式：自托管 runner（未配 SSH 密钥，将在带 deploy 标签的 runner 上执行）"
          echo "::warning::未配置 DEPLOY_HOST/DEPLOY_SSH_KEY：若仓库也没有自托管 runner，本次部署将停在“等 runner”上。"

  # 模式 A：自托管 runner（部署机上已注册，标签 deploy）
  deploy-self-hosted:
    needs: preflight
    if: needs.preflight.outputs.mode == 'self-hosted'
    runs-on: [self-hosted, deploy]
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout (deploy host keeps the repo)
        # persist-credentials: false：不把 GITHUB_TOKEN 留在部署机的 .git/config
        # （部署不需要 git push；SHA 钉版与仓库「钉 digest」标准一致）。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 直接调脚本：备份 / 迁移 / 切换 / 健康门禁 / 失败回滚全在脚本内，
      # 工作流不重复实现一遍判据（否则两处逻辑会漂移）。
      - name: Run deploy.js
        env:
          # digest 钉死引用（preflight 验签 + 解析的产物），不是输入的原始 tag：
          # 验签与 pull 落在同一份不可变内容上，标签此后被覆盖影响不到本次发布。
          APP_IMAGE: ${{ needs.preflight.outputs.image_ref }}
          # 最后一道闸：deploy.js 侧拒绝一切非 digest 引用（含误配直传 tag）
          DEPLOY_REQUIRE_DIGEST_PIN: 'true'
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          # compose 用 `${ALLOWED_HOSTS:?}` 强制显式声明，缺它会在"切换"那步才被拒
          # （此前只下发 CORS_ORIGIN ⇒ 前置校验通过、切换时才炸）。见 deployWorkflow 自检。
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
          # 两个开关同样走 env：本文件的规定是 run 脚本里零 `${{ }}` 文本插值
          DRY_RUN: ${{ inputs.dry_run }}
          SKIP_BACKUP: ${{ inputs.skip_backup }}
        run: |
          set -euo pipefail
          args=()
          [[ "$DRY_RUN" == "true" ]] && args+=(--dry-run)
          [[ "$SKIP_BACKUP" == "true" ]] && args+=(--skip-backup)
          node scripts/deploy.js "${args[@]}"

  # 模式 B：SSH（部署机上有仓库副本，通过 DEPLOY_PATH 指定）
  deploy-ssh:
    needs: preflight
    if: needs.preflight.outputs.mode == 'ssh'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        # 密钥走 stdin 写入，不出现在命令行（命令行会进进程列表）；
        # known_hosts 必选：不配就退回 StrictHostKeyChecking=accept-new，
        # 首次连接会靠 TOFU（依赖首次见到的密钥）。生产建议配上。
        run: |
          set -euo pipefail
          # 三个 secret 随后都要拼进 ssh：DEPLOY_PATH 落在远程命令的**单引号**里
          # （cd '<path>'），DEPLOY_USER/DEPLOY_HOST 落在 `user@host` 这一个 argv 里。
          # 前者含 `'` 即可闭合单引号、在持有部署凭据的目标机上执行任意命令
          # （与已收口的镜像名闸同型：仓库段曾是 `.+`）；后者为空或含空格会让 ssh
          # 把 argv 当选项解析（-oProxyCommand=… 直接在本 runner 上执行命令）。
          # secret 只有仓库管理员能设，但部署机凭据不该依赖"管理员不会写错"。
          # 一次性在这里判掉（放在唯一一处，避免同一规则两处各写一份而漂移）：
          # 不写密钥、不连主机就先失败，避免半程状态。
          if [[ ! "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::DEPLOY_PATH 必须是不含空格/引号的绝对路径（仅 [A-Za-z0-9._/-]；不支持带空格的 IPv6/路径写法）：$DEPLOY_PATH"
            exit 1
          fi
          if [[ ! "$DEPLOY_USER" =~ ^[A-Za-z0-9._][A-Za-z0-9._-]*$ ]]; then
            echo "::error::DEPLOY_USER 非法（必须非空、不以 - 开头、仅含 [A-Za-z0-9._-]，不得含空格或 @）"
            exit 1
          fi
          if [[ ! "$DEPLOY_HOST" =~ ^[A-Za-z0-9._][A-Za-z0-9._-]*$ ]]; then
            echo "::error::DEPLOY_HOST 非法（必须非空、不以 - 开头、仅含 [A-Za-z0-9._-]；IPv6 字面量请改用主机名）"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [[ -n "${DEPLOY_KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts
            echo "OPTIONS=-o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
          else
            echo "::warning::未配 DEPLOY_KNOWN_HOSTS：本次连接使用 TOFU（accept-new），建议后续补上以防中间人。"
            echo "OPTIONS=-o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"
          fi
          # 失败则连接层就会拒绝（fail-closed）
          ssh $OPTIONS -i ~/.ssh/id_deploy -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" -- echo "ssh ok"

      - name: Run deploy.js on the host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          # 与 self-hosted 路径同口径：compose 的 `:?` 要求两条部署路径都下发
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
          IMAGE_TAG: ${{ needs.preflight.outputs.image_ref }}
          # 与 self-hosted 同口径：deploy.js 侧拒绝非 digest 引用。
          # 注意这份 env 只到本 runner 为止，目标机上的 deploy.js 看不见它——
          # 真正生效靠下一步把它拼进远程命令（`${:?}` 漏配即报错，不静默展开成空串）。
          DEPLOY_REQUIRE_DIGEST_PIN: 'true'
          DRY_RUN: ${{ inputs.dry_run }}
          SKIP_BACKUP: ${{ inputs.skip_backup }}
        run: |
          set -euo pipefail
          extra=""
          [[ "$DRY_RUN" == "true" ]] && extra="$extra --dry-run"
          [[ "$SKIP_BACKUP" == "true" ]] && extra="$extra --skip-backup"
          # CORS_ORIGIN / ALLOWED_HOSTS 经 SendEnv 传入而非拼进命令串，避免它们落到
          # 目标机的 shell 历史/进程列表里。命令串里插值的是镜像名、digest 钉闸开关、
          # 两个部署开关与 DEPLOY_PATH：镜像名由 preflight 校验，inputs 由 workflow_call
          # 校验，DEPLOY_PATH 由 Prepare SSH 那一步的字符集闸校验。
          # DEPLOY_REQUIRE_DIGEST_PIN 为什么必须拼进命令串：ssh 不转发本地环境变量，
          # SendEnv 也只在目标机 sshd 显式 AcceptEnv 该变量名时才生效（默认只放行 LANG/LC_*）。
          # 上面 env 块里那份只到本 runner 为止——此前它从未出现在远程命令里，
          # 于是「与 self-hosted 同口径」的兜底闸在 SSH 路径上一直是静默关闭的。
          # 用 `${var:?}` 而非 `$var`：漏配时报错退出，而不是展开成空串让 deploy.js 把闸读成"关"。
          ssh $OPTIONS -i ~/.ssh/id_deploy -o BatchMode=yes -o SendEnv=CORS_ORIGIN,ALLOWED_HOSTS \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && APP_IMAGE='$IMAGE_TAG' DEPLOY_REQUIRE_DIGEST_PIN='${DEPLOY_REQUIRE_DIGEST_PIN:?deploy-ssh 未下发 digest 钉死闸}' node scripts/deploy.js $extra"
