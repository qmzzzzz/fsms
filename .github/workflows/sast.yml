name: SAST（Semgrep，仓库自持规则包）

# 【补的是哪个缺口】2026-10-31 收口时本仓是私有仓：`codeql.yml` 的第一层判据
# `github.event.repository.private == false` 不成立，CodeQL 从未运行过，仓库当时
# **没有任何静态分析器在跑**，findings 只能靠人工评审撞见
# （docs/security-dependency-watch.md 的「缺口登记与收口」一节如实登记了这条）。
# 仓库转公开后该判据成立，CodeQL 已实际在跑——本作业与它是**并行的两层**，不是替代；
# 分工边界见该文档「现状：仓库已公开，分析器分工」一节。
#
# 【为什么仍是本作业 + 仓库自持规则包】历史前提（私有仓没有 GHAS、SARIF 交
# `upload-sarif` 会被拒）已随转公开失效，但这个形态在公开仓下依然成立，理由换成规则卫生：
# 规则取自仓库内的 `.github/semgrep/rules.yml`（不用 `--config auto`、不向 registry 拉规则，
# 规则随仓库版本化、评审可见），并在 `--metrics=off` 下运行、容器镜像按 digest 钉死
# ⇒ 扫描行为可复现，不随上游规则漂移静默改变。
#
# 【这一层能被证伪吗】三条：
#   ① 规则包先 `--validate`：规则写坏=扫描 0 条规则后报绿，是最坏的绿；
#   ② 扫描带 `--error`：任何 ERROR 级 finding 让 job 非零退出（不是"报告一下"）；
#   ③ 规则条数/必备字段/排除面/零命中由 `src/tests/ci/sastWorkflowInvariants.test.js` 逐条钉住。
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每周一次：代码在动，历史代码也要按当前规则复查（PR 只覆盖增量）
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: 本地规则包扫描
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 容器镜像写在 image: 位置（能被镜像面账看见），digest 与 scripts/verify-image-digests.js
    # 的期望表同源；镜像里没有 node，故本作业只跑 semgrep，不跑任何 npm/node 步骤。
    container:
      image: semgrep/semgrep:1.183.0@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 校验规则包（写坏规则 = 门禁静默空跑）
        run: semgrep scan --validate --config .github/semgrep/rules.yml

      - name: 扫描（命中即非零退出）
        run: semgrep scan --config .github/semgrep/rules.yml --error --metrics=off --disable-version-check --sarif --output sast.sarif src scripts migrations e2e web-admin/src

      - name: 上传 SARIF（落制品供复核：收口时的前提是私有仓无 GHAS，转公开后是否改走 code scanning 上传是一次未拍板的行为变更，维持现状）
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-sarif
          path: sast.sarif
          if-no-files-found: error
