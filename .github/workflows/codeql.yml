name: 'CodeQL'

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 3 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # 挂死保护（2026-11-18 审计 B）：CodeQL 全量分析实测分钟级，60 分钟为宽上限；
    # 不设 timeout 的 job 挂住时会一直占着 runner。
    timeout-minutes: 60
    # 本行判据是 2026-09-11 立下的：当时本仓是私有仓、未开通 code scanning
    # （GitHub Advanced Security），CodeQL 的分析本身能完整跑完，但 SARIF 上传会被拒——
    #   "Code scanning is not enabled for this repository. Please enable code
    #    scanning in the repository settings."
    # job 必红且扫描结果无处落地，等于纯烧 runner 时间（2026-09-11 CI 实证：
    # analyze 步骤 6 分钟跑完 344 个文件，最后一步 403）。经 API 开启 default
    # setup 也被 404 拒绝，说明当时套餐/账号形态下无法程序化开启。
    # 【2026-11-14 现状】仓库已转公开 ⇒ 判据成立，本工作流在 push（main/develop）、
    # PR 与每周一 03:00 UTC 定时上实际运行，SARIF 进 Code Scanning（Security 面板）。
    # 这行 if 保留不删：它是「仓库若再转私有就自动停跑」的兜底，避免回到
    # 每周必红 403 的空烧形态；分析器分工见 docs/security-dependency-watch.md。
    if: github.event.repository.private == false
    permissions:
      # 声明 permissions 会整体覆盖仓库默认令牌作用域，未列出的作用域一律变成 none，
      # 因此必须显式补回本流程真正用到的每一项（2026-09-11 CI 逐项实证）：
      #   contents: read        → 缺了 actions/checkout 报 "Repository not found"
      #                           （2026-09-14 复发：树同步时误用旧版覆盖本文件，
      #                            Checkout repository 步骤再次失败）
      #   actions: read         → 缺了 analyze 报 "Resource not accessible by integration"
      #                           （其内部会调 GET /actions/runs/{id} 取运行元数据）
      #   packages: read        → analyze 拉取依赖包所需（私有仓时代实证；公开仓下保留无害）
      #   security-events: write → 上传 SARIF 到 code scanning
      contents: read
      actions: read
      packages: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript]

    steps:
      - name: Checkout repository
        # persist-credentials: false：checkout 的持久凭据是多余外泄面；不影响
        # codeql-action（SARIF 上传经其内部 GITHUB_TOKEN 参数，不依赖 .git/config）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: '/language:${{ matrix.language }}'
