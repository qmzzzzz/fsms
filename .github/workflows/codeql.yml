name: 'CodeQL'

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 3 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      # 声明 permissions 会整体覆盖仓库默认令牌作用域，未列出的作用域一律变成 none，
      # 因此必须显式补回本流程真正用到的每一项（2026-09-11 CI 逐项实证）：
      #   contents: read        → 缺了 actions/checkout 报 "Repository not found"
      #   actions: read         → 缺了 analyze 报 "Resource not accessible by integration"
      #                           （其内部会调 GET /actions/runs/{id} 取运行元数据）
      #   packages: read        → analyze 拉取依赖包所需（私有仓）
      #   security-events: write → 上传 SARIF 到 code scanning
      contents: read
      actions: read
      packages: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
