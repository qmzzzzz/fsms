name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 工作流级最小权限（安全审计 #9）：只读兜底。声明 permissions 会整体覆盖仓库默认
# 令牌作用域，未列出的作用域一律为 none；需要写权限的 job 在**job 级** permissions
# 里覆盖顶层——本文件只有 build（packages: write + id-token: write，GHCR 推送与
# cosign 签名）与 secret-scan（pull-requests: read，gitleaks 推导 PR 扫描范围）两处。
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Node 18 于 2025-04 EOL，2026-09-28 移除。原因是**结构性必红**，与公开仓额度无关：
        # 本 job 第 5 步要构建前端，而 web-admin 的 Vite ^8.1.4 其 engines 为
        # `^20.19.0 || >=22.12.0` ⇒ Node 18 下 `vite build` 必失败，且失败会 fail-fast
        # 把 lint / format / 编码 / 合规 / 测试等后续 9 步全部 skip（该版本等于什么都没验）。
        # 历史上「Node 18 两类失败」（时区断言、teardown 后静默 exit 1）此前确已闭合，
        # 但 Vite 8 的 engines 是第三类，且在 18 上不可能通过。
        node-version: [20.x, 22.x]

    steps:
      # persist-credentials: false：不把 GITHUB_TOKEN 留在 .git/config。本工作流没有任何
      # git push 步骤，checkout 的持久凭据是纯多余的外泄面（与 scorecard.yml 同口径；
      # 所有 actions 均已按仓库「钉 digest」标准钉到不可变 commit SHA）。
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node-version }}
          # 缓存两份 lockfile（后端与 web-admin）：下方两次 npm ci 都受益
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web-admin/package-lock.json

      # 刻意**不加** --ignore-scripts：下方的 `npm test` 需要内存 MongoDB。
      # devDeps 里唯一带 install 脚本的 mongodb-memory-server 的 postinstall 负责预下载
      # mongod 二进制；若在此跳过，下载会延迟到 jest worker 内首次 create 时才发生——
      # 本仓库已有实证记录（见下方 --forceExit 注释）：mongodb-memory-server 子进程
      # 句柄与 jest 主进程退出存在清理竞态。把「安装期的一次性二进制下载」挪进测试进程
      # 会新增一个不可控的时序面；而本 job 装的是 devDeps，其供应链面本就由 security-audit
      # 里的安装脚本硬门禁守着，两相权衡不加更稳。
      - name: Install dependencies
        run: npm ci

      # 体积预算的端到端断言（src/tests/deploy/bundleBudget.test.js 的「真实产物」部分）
      # 需要真实的 web-admin/dist；而 dist 是构建产物、已被 .gitignore 排除，CI 上不存在。
      # 该用例组**刻意不静默跳过**（那会让门禁在最需要它的场景变绿），
      # 因此这里真构建一次，使断言在 CI 上同样成立。
      - name: Build frontend (bundle budget tests need real dist)
        run: |
          npm --prefix web-admin ci
          npm --prefix web-admin run build

      - name: Run lint
        run: npm run lint

      # O-3 体积棘轮：max-lines / max-lines-per-function 以 warn 级接入，
      # 逐文件计数对照 eslint.ratchet.json 基线——任何文件 warn 计数只许降
      # 不许升（瘦身生效后本地 --update-baseline 收紧并随提交评审）
      - name: Run lint ratchet (size baseline)
        run: npm run lint:ratchet

      # O-12 格式门禁：源码区（src/、web-admin/src/ 等）必须符合 .prettierrc，
      # 本地用 `npm run format` 一键修复；check 失败即 CI 失败
      - name: Run format check (prettier)
        run: npm run format:check

      # 编码门禁：源码必须是 UTF-8 且不含乱码指纹（GBK 混入 / U+FFFD / mojibake）。
      # 2026-09-19 实证过"脚本存在但没有任何工作流引用它"的腐化形态——
      # 一道没人调用的门禁比没有更糟：它给出已设防的错觉。
      # 判据由 src/tests/deploy/ciGateWiring.test.js 钉住（删步骤即红）。
      - name: Check source encoding (UTF-8 / mojibake fingerprints)
        run: npm run check:utf8

      # 合规门禁：append-only 钩子是否还挂着、审计导出边界是否还在、
      # WAL 兜底有没有被摘掉。此前只被 `npm run security:audit` 引用，
      # 而 security-audit job 只跑 npm audit ⇒ 这些检查从未真正被自动兑现。
      - name: Run compliance checks (audit invariants)
        run: node scripts/compliance-check.js

      # --forceExit：2026-09-15 CI 实证（4 轮 × Node 18/20/22），测试 1754 全过、
      # globalTeardown 成功后约 130ms 进程静默 exit 1、无任何错误输出——
      # mongodb-memory-server 子进程句柄与 jest 主进程退出的清理竞态，本地
      # （Win/GMT+8/Node 22/20）始终 exit 0 无法复现。teardown 完成即代表
      # 全部断言已通过且数据库已清理，forceExit 仅绕过退出阶段的悬挂句柄，
      # 不影响测试语义。--watch 场景不兼容 forceExit，但 CI 无 watch。
      - name: Run tests
        run: npm test -- --forceExit
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret
          AES_SECRET_KEY: test-aes-key-32-chars-minimum!!
          HMAC_SECRET: test-hmac-secret

      # 顺序无关门禁（2026-09-18 新增）：本仓库的测试曾隐含「用例/文件按固定顺序执行」
      # 的未声明前提——固定顺序全绿、加 --randomize 则 12 个套件转红。这类回归
      # 极隐蔽：CI 此前只跑固定顺序，破坏顺序无关性的改动（新增共享模块级状态、
      # 跨用例复用造数、jest.resetModules 污染全局注册表…）在 CI 上永远绿灯，
      # 直到某次无关改动改变了文件/用例的执行次序才突然爆发，且极难定位。
      # 此门禁用固定 seed 跑一轮随机顺序：seed 固定 → 结果可复现（不是抽奖式门禁），
      # 又足以覆盖与默认顺序不同的排列。
      #
      # 2026-09-18 起把"一个 seed"改成"多个 seed"（当前三个）：单 seed 只能证明"这一种
      # 排列"通过，而顺序耦合是概率性的——当天实测两个真实耦合都在默认 seed 下隐身、换 seed 才红：
      #   seed 777001 → assignRoles 三条用例共用一个 victim，"放行"那条把 level 6
      #                  角色写进去后，目标侧层级闸抢在 B-2/P2-8 前面拦下请求；
      #   seed 31337  → infraHardening 全文件共用 config/swagger 的 docsLimiter
      #                  模块级单例，跑满 429 的用例让后续用例的 200 变 429。
      # 两处都已修（前者按用例重置起点，后者进入前清自己的键），seed 也保留在
      # 这里当回归样本：再引入共享状态型耦合，这两个排列会替我们抓到。
      #
      # 但"注释声称保留"不等于"真的在跑"：777001 一度只写在上面这段说明里，
      # 下面的列表却是 20260917 31337 ——抓到过真实耦合的那个排列一次都没再执行，
      # 该样本的门禁形同虚设。现在列表含全部三个 seed，并由 gateSelfTest 断言。
      - name: Test order independence (randomized)
        run: |
          fail=0
          for seed in 20260917 31337 777001; do
            echo "::group::jest --randomize --seed=$seed"
            npx jest --randomize --seed="$seed" --forceExit || fail=1
            echo "::endgroup::"
          done
          exit "$fail"
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret
          AES_SECRET_KEY: test-aes-key-32-chars-minimum!!
          HMAC_SECRET: test-hmac-secret

      - name: Run tests with coverage
        # 这里刻意不带 --if-present：该标志在脚本改名/删除时把「门禁止血」
        # 变成「跳过且不报错」，覆盖率阈值（jest.config.js coverageThreshold）
        # 就再也不执行了。frontend-build 作业里的同名步骤（web-admin 的 vitest 门）
        # 同样没加此标志。由 src/tests/ci/coverageGateWiring.test.js 钉住（含反向对照）。
        run: npm run test:coverage -- --forceExit
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret
          AES_SECRET_KEY: test-aes-key-32-chars-minimum!!
          HMAC_SECRET: test-hmac-secret

      - name: Upload backend coverage
        if: matrix.node-version == '22.x'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ./coverage/lcov.info
          # 配置 CODECOV_TOKEN 后上传即生效；未配置时私有仓上传必然失败，
          # 保持软门禁（覆盖率棘轮的真实门禁在上一步 jest --coverage 阈值）
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  security-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Use Node.js 20.x
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20.x

      - name: Audit backend dependencies
        # I-M3：取消 continue-on-error——高危依赖告警直接让 job 失败（硬门禁）；
        # 结果写入 Job Summary 留痕（此前软门禁会静默吞掉告警，事后无法追溯）
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=moderate | tee audit-backend.txt
          echo "### Backend npm audit" >> "$GITHUB_STEP_SUMMARY"
          tail -3 audit-backend.txt >> "$GITHUB_STEP_SUMMARY" || true

      # P2-⑫：安装脚本必须显式登记（fail-closed + 显式白名单），分两档。
      # 比 --ignore-scripts 更强：ignore-scripts 只让本机跳过，树里有没有脚本没人看；
      # 这里把不变量变成 CI 硬门禁——新增带 install 脚本的依赖必须登记理由。
      # 判据来源是 package-lock.json 的 packages 段（npm ls --json 不含 scripts 字段）；
      # 该 job 因上游 `npm audit` 已隐式装好依赖，锁文件必然就位。
      - name: Check prod dependency install scripts
        # 生产树：Dockerfile runtime 阶段 `npm ci --omit=dev --ignore-scripts` 的安全性
        # 由这一档保证——它证明忽略脚本后的生产闭包里根本没有脚本需要忽略。
        run: node scripts/check-prod-install-scripts.js --omit=dev

      - name: Check dev dependency install scripts
        # dev 树：devDeps 的安装脚本会在开发机与 test/e2e 作业上真实执行（那里刻意不加
        # --ignore-scripts，因为测试需要 mongod），是真实供应链风险面，必须显式登记。
        run: node scripts/check-prod-install-scripts.js --scan

      - name: Audit web-admin dependencies
        working-directory: web-admin
        # I-M3：同上，硬门禁 + 留痕
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=moderate | tee ../audit-web.txt
          echo "### Web-admin npm audit" >> "$GITHUB_STEP_SUMMARY"
          tail -3 ../audit-web.txt >> "$GITHUB_STEP_SUMMARY" || true

      # 供应链完整性锚：lockfile 的 semantic 哈希必须与 deployment/lockfile-anchor.json 一致。
      # 本仓的其余检测面（npm audit / Dependabot / CodeQL / gitleaks / install-script 门禁）
      # 全部只回答「这个包有没有已知 CVE」，于是**lockfile 被静默篡改**毫无检测：
      # PR 夹带改 integrity、本地误跑 npm install 改分辨率、CI 缓存污染。本步把它变成硬门禁。
      # 口径是 JSON 递归排序 + 紧凑序列化后的 SHA-256（**不是原始字节哈希**）：开发机 CRLF、
      # CI ubuntu LF，raw 口径会在 CI 上恒假红，而假红第一次出现就会被消化掉（方案 §1.3 实测）。
      # 覆盖后端与 web-admin 两份锁文件；zznpmtest/ 未入库，刻意不纳入。
      # 注意：它挡不了"上游包本身被投毒且 lockfile/integrity 未变"，也**不是 SBOM**。
      - name: Verify lockfile integrity anchor
        run: node scripts/check-lockfile-integrity.js --verify

  secret-scan:
    runs-on: ubuntu-latest

    # 本仓库的默认工作流权限是「仅 contents/packages 只读」这一档，未显式声明的
    # 作用域一律为 none。gitleaks 在 pull_request 事件下要调
    # GET /repos/{owner}/{repo}/pulls/{n}/commits 推导扫描范围，
    # 缺 pull-requests: read 会以 403「Resource not accessible by integration」
    # 让 job 直接失败——2026-09-11 CI 实证（全部 dependabot PR 的 secret-scan 全红）。
    # 声明在 job 级以覆盖工作流级顶层（顶层 contents: read 只读兜底，见文件头）。
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # push 事件下 action 的 baseRef 推导有个硬伤：它取 eventJSON.commits[0].id
      # 再拼成 `<base>^..<head>`（^ 是硬编码的）。首次推送/新建分支时 commits[0]
      # 正是**根提交**，`root^` 不存在，gitleaks 报 "stderr is not empty" 退出 1，
      # 而扫描字节数是 0——门禁红了但等于没扫（最坏情况：红绿都不可信）。
      # BASE_REF 是 action 官方支持的覆盖项，这里改用它，并针对新建分支
      # （event.before 为 40 个 0）退一格取「根提交之后的第一个提交」，
      # 使范围变为 root..head 且可解析，覆盖本次推送的全部非根提交。
      # 仅 push 事件生效：pull_request 事件必须留空，否则会覆盖 action 自己的
      # PR 范围推导（那段逻辑是对的，不要动）。
      - name: Resolve gitleaks base ref
        id: gitleaks-base
        if: github.event_name == 'push'
        # github.event.before 经 env 进入脚本（安全审计 #9，与 deploy.yml 同口径）：
        # `${{ }}` 是文本级替换、先于 shell 解析，直接写进 run 是脚本注入面；
        # env 赋值不参与 shell 文本展开，才是安全通道。
        env:
          GITHUB_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          ref="$GITHUB_BEFORE_SHA"
          if [ -z "$ref" ] || [ "$ref" = "0000000000000000000000000000000000000000" ]; then
            root="$(git rev-list --max-parents=0 HEAD)"
            ref="$(git rev-list --first-parent --reverse "$root..HEAD" | head -n 1)"
            # 单提交仓库（root 即 HEAD）无「根之后的提交」可退，退化扫 tip 提交
            [ -n "$ref" ] || ref="$(git rev-parse HEAD)"
          fi
          echo "gitleaks base ref => $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Run Gitleaks
        # v3（2026-05 发布）仅迁移运行时 Node 20 → 24，输入/输出/行为均无变化
        # （官方 README「Migrating from v2 to v3」：no changes to inputs, outputs, or behavior），
        # 当年保守保留 v2 的顾虑（输入契约变化）已不成立，一行升级即可。
        # 时间线：2026-06-02 起 runner 默认 Node 24（v2 已报警告）；
        # 2026-09-16 Node 20 从 runner 彻底移除，v2 无条件失效——必须升 v3。
        # 个人账号仓库无需 GITLEAKS_LICENSE（仅组织仓库需要）。
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # push 事件下显式传入解析好的 base ref（见上：覆盖 action 的根提交硬伤）
          BASE_REF: ${{ steps.gitleaks-base.outputs.ref }}

  frontend-build:
    runs-on: ubuntu-latest

    # 时区必须钉死：web-admin 有一组断言测的就是「界面按**本地**时区口径格式化」
    # （views/reportView 的「日期区间按本地日期串提交」、views/ipListView 的
    # 「时间列本地时区口径」、views/inspectionView 的失败提示链路）。在 UTC runner 上
    # local === UTC，这些断言退化成恒等式而必然失败——2026-09-28 CI 实证：3 个文件 4 条红。
    # 钉一个固定非 UTC 区后判据在任何 runner 上都可证伪，且与本机开发环境（GMT+8）同口径。
    # 刻意不用 TZ=UTC：那会让这批用例彻底失去意义，等于删掉判据而不是修好它。
    env:
      TZ: Asia/Shanghai

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Node 24：web-admin 锁定的 jsdom 30 依赖 undici 8.10.0，其内置 webidl
      # 直接调用 worker_threads.markAsUncloneable（Node 22.10+ 才有），
      # Node 20 下 jsdom 加载即崩、全部 worker 起不来（2026-09-05 CI 实证）
      - name: Use Node.js 24.x
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: web-admin/package-lock.json

      - name: Install dependencies
        working-directory: web-admin
        run: npm ci

      # 七维终评（代码质量）补门禁：前端 ESLint 与后端 lint 同级硬门禁。
      # 此前仅本地有 lint:web 脚本而 CI 未跑，前端代码风格/错误靠自觉；
      # 放在测试与构建之前，尽早拦截（当前基线已验证可通过）
      - name: Run frontend lint
        working-directory: web-admin
        run: npm run lint

      # T-3：前端测试 + 覆盖率硬门禁（vitest coverage.thresholds 低于基线即非零退出）
      - name: Run frontend tests with coverage
        working-directory: web-admin
        run: npm run test:coverage

      # 顺序无关门禁（前端，2026-09-18 新增，与后端同名步骤对称）：
      # 后端曾出现 12 个套件依赖固定执行顺序的隐患（见 test job 内说明），
      # 前端同样存在模块级共享状态（sessionStorage、document.documentElement.lang、
      # i18n 单例 locale、ResizeObserver 全局替身等），文件顺序一变就可能互相污染。
      # 此前的 frontend 只跑默认顺序，这类问题在 CI 上永远绿灯。
      # seed 固定 → 结果可复现（非抽奖式门禁），又与默认顺序构成不同排列。
      - name: Frontend test order independence (shuffled)
        working-directory: web-admin
        run: npx vitest run --sequence.shuffle --sequence.seed=20260918

      - name: Build frontend
        working-directory: web-admin
        run: npm run build

      # 体积预算硬门禁（七维终评补）：vite 的 chunkSizeWarningLimit 只是构建期警告，
      # 不阻断构建——误引入大依赖、manualChunks 规则失效、PWA 预缓存膨胀，
      # 都会让 CI 全绿而用户端首屏变慢。这一步把体积变成硬门禁（超预算即非零退出），
      # 必须紧跟在 build 之后——它的断言对象就是 dist/。
      - name: Check frontend bundle budget
        working-directory: web-admin
        run: npm run build:budget

      - name: Upload frontend coverage
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ./web-admin/coverage/lcov.info
          # 同后端口径：配置 CODECOV_TOKEN 后上传即生效，未配置时尽力而为；
          # 真实覆盖率门禁在上一步 vitest coverage.thresholds
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  e2e:
    # I-L6：E2E 冒烟 + 生产模式演练接入 CI。这一层走 index.js 完整启动序列
    # （dotenv→强校验→密钥注入→播种→监听→WebSocket/调度器/审计缓冲），
    # 是 supertest 套件测不到的接线层兜底；prod-drill 另验生产门禁。
    # 两脚本自带随机强密钥与内存 Mongo，无需额外 service 容器。
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Use Node.js 20.x
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20.x

      # 加 --ignore-scripts 的安全性判据：本 job 只跑 e2e-smoke / production-drill
      # 两个脚本，二者自带随机强密钥与**内存 Mongo**（见上方 job 注释）——但内存 Mongo
      # 正是 devDeps 里的 mongodb-memory-server，其 postinstall 负责预下载 mongod。
      # 与 test job 同理：跳过脚本会把下载延迟进脚本进程本身，故**同样保持不加**。
      # 若将来确需在此省掉 devDeps 安装脚本，前提是先把 mongod 二进制显式预置为不变量。
      - name: Install dependencies
        run: npm ci

      - name: Run E2E smoke（完整启动序列 14 步）
        run: npm run test:e2e

      - name: Run production drill（生产模式演练 9 步）
        run: npm run test:prod-drill

  e2e-browser:
    # 评价报告 H1：浏览器旅程为发布镜像硬门禁。桌面与移动端旅程
    # 已在本地真实栈稳定通过；MFA 旅程继续按环境能力跳过。
    runs-on: ubuntu-latest

    services:
      mongo:
        # 评价报告 #18：mongo 版本口径统一到生产 compose 的钉版 6.0.20
        image: mongo:6.0.20
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Use Node.js 20.x
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20.x

      # 加 --ignore-scripts 的安全性判据：本 job 的 Mongo 来自上面的 mongo:6.0.20
      # service 容器（真实 mongod），**不使用** devDeps 的 mongodb-memory-server，
      # 全量安装的 devDeps 只是为了让 playwright 与各脚本能 require（CI 用不到
      # mongodb-memory-server 的 postinstall 预下载）。故这里可以安全跳过安装脚本。
      - name: Install backend dependencies
        run: npm ci --ignore-scripts

      - name: Install frontend dependencies and build
        run: |
          npm --prefix web-admin ci
          npm --prefix web-admin run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start full stack
        id: full-stack
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/fsms_browser_e2e
          LOGIN_CAPTCHA_ENABLED: 'false'
          ALLOW_PUBLIC_REGISTRATION: 'false'
        run: |
          E2E_TEST_PASSWORD="E2e!$(openssl rand -hex 12)Aa1"
          # 评价报告 #16：MFA 旅程固定种子（base32，RFC 4648 测试向量式占位）
          E2E_MFA_SEED="JBSWY3DPEHPK3PXP"
          # AES 密钥生成一次，服务端与 MFA 种子加密脚本共用（否则密文解不开）
          E2E_AES_KEY="$(openssl rand -hex 32)"
          export E2E_TEST_PASSWORD
          NODE_ENV=development \
          PORT=3000 \
          SERVE_FRONTEND=true \
          MONGODB_URI="$MONGODB_URI" \
          JWT_SECRET="$(openssl rand -hex 32)" \
          JWT_REFRESH_SECRET="$(openssl rand -hex 32)" \
          AES_SECRET_KEY="$E2E_AES_KEY" \
          HMAC_SECRET="$(openssl rand -hex 32)" \
          ADMIN_INITIAL_PASSWORD="$E2E_TEST_PASSWORD" \
          LOGIN_CAPTCHA_ENABLED="$LOGIN_CAPTCHA_ENABLED" \
          ALLOW_PUBLIC_REGISTRATION="$ALLOW_PUBLIC_REGISTRATION" \
          CORS_ORIGIN=http://127.0.0.1:3000 \
          LOG_LEVEL=warn \
          node src/index.js > logs-browser-e2e-backend.log 2>&1 &
          echo "$!" > browser-e2e-backend.pid
          echo "password=$E2E_TEST_PASSWORD" >> "$GITHUB_OUTPUT"
          echo "mfa-seed=$E2E_MFA_SEED" >> "$GITHUB_OUTPUT"

          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/readyz >/dev/null; then
              # 评价报告 #16：MFA 旅程用独立账号 mfa_e2e（固定种子）——
              # 不动 admin：否则其余旅程的登录会被 MFA 墙挡住。
              # 密码用 bcrypt 落库（经 User 模型预存钩子），种子存 AES 密文。
              # 用户名只能取 [A-Za-z0-9_]（src/models/User.js 的 username match 正则，
              # 「用户名只能包含字母、数字和下划线」）。**不能写成 mfa-e2e**：连字符会被
              # 模型校验拒绝 → User.create 抛 ValidationError → `bash -e` 直接中断本步骤。
              # 该步的 60 次重试只兜"后端没起来"，兜不住"种子脚本自身失败"，
              # 且失败表现是 e2e-browser 卡在 Start full stack（Run browser journeys 被跳过），
              # 看起来像服务起不来，实际是账号名不合法——2026-09-29 定位。
              AES_SECRET_KEY="$E2E_AES_KEY" JWT_SECRET="$E2E_AES_KEY" HMAC_SECRET="$E2E_AES_KEY" \
              E2E_MFA_PASSWORD="$E2E_TEST_PASSWORD" node -e "
                const mongoose = require('mongoose');
                (async () => {
                  await mongoose.connect(process.env.MONGODB_URI);
                  const User = require('./src/models/User');
                  const Role = require('./src/models/Role');
                  const { encryptMfaSecret } = require('./src/utils/mfaSecret');
                  const role = await Role.findOne({ code: 'SUPER_ADMIN' });
                  if (!role) throw new Error('SUPER_ADMIN 角色未播种');
                  let u = await User.findByUsername('mfa_e2e');
                  if (!u) {
                    u = await User.create({
                      username: 'mfa_e2e',
                      email: 'mfa_e2e@example.com',
                      password: process.env.E2E_MFA_PASSWORD,
                      roles: [role._id],
                      status: 'active',
                    });
                  }
                  const enc = encryptMfaSecret('$E2E_MFA_SEED');
                  await User.updateOne(
                    { _id: u._id },
                    { \$set: { mfaEnabled: true, mfaSecret: enc, mfaLastCounter: 0, status: 'active' } }
                  );
                  console.log('mfa_e2e seeded');
                  await mongoose.disconnect();
                })().catch((e) => { console.error(e); process.exit(1); });
              "
              exit 0
            fi
            sleep 1
          done
          cat logs-browser-e2e-backend.log
          exit 1

      - name: Run browser journeys
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_USER: admin
          E2E_PASS: ${{ steps.full-stack.outputs.password }}
          # 评价报告 #16：MFA 旅程用独立账号 mfa_e2e——种子在上一环节点脚本
          # 写入该账户（AES 密文），TOTP 码由 journey 内按种子实时生成
          E2E_MFA_USER: mfa_e2e
          E2E_MFA_PASS: ${{ steps.full-stack.outputs.password }}
          E2E_MFA_SECRET: ${{ steps.full-stack.outputs.mfa-seed }}
        run: |
          set -o pipefail
          npm run test:e2e:browser -- --workers=1 --project=desktop-chromium --project=mobile-chrome 2>&1 | tee playwright-run.log

      - name: Assert no skipped journeys
        # 评价报告 #16：E2E 曾可全量跳过且 CI 全绿（「0 执行也绿」的假门禁）。
        # 2026-09-28 补上第二半：原实现只断言 skipped==0，而且把「日志里根本没有汇总行」
        # 默认读成 skipped=0 —— 于是跑崩 / 配置错 / 被 --project 过滤成空集时**照样通过**。
        # 现改为 fail-closed：汇总行必须存在，且 passed 有下界。
        # 下界 = 16 条无条件旅程（6 个 spec） × 2 个 project = 32，不是"覆盖率阈值"，
        # 而是「旅程被静默裁剪」的告警；确实要删旅程时同步改这个数字，
        # 让删减在 diff 里可见（与 eslint.ratchet.json 收紧必须走评审同一条纪律）。
        # 刻意只数**无条件**旅程：另有 9 条 `test.skip(cond)` 条件旅程，它们跑不跑
        # 由 E2E_USER/E2E_PASS 是否注入决定，把它算进下界会在凭据缺失时把门禁
        # 变成"永远红"；而它们真被跳过时下方 `skipped > 0` 已经判红，不在此处重复计。
        # 该数字不再靠人工同步：由 src/tests/playwrightConfig.test.js 的
        # 「E2E 旅程数与 CI 防裁剪下界一致」门禁做实对账——增删旅程而不同步改这里，
        # 或反过来把这个数字改小来掩盖删减，都会在 test job 里直接变红。
        # 依据：Playwright 的 generateSummary() 遍历 suite.allTests() 只产出**一个**全局
        # 汇总行（runner/index.js:1210），所以首个匹配即全量值，不存在按 project 分行的歧义。
        # 注意 `N skipped` / `N failed` 两行**只在计数非 0 时才打印**
        # （generateSummaryMessage 是 `if (skipped)` / `if (unexpected.length)`），
        # 因此"这两行缺失"是正常态，不能当失败；能证明"跑过了"的只有 `N passed` 那一行。
        run: |
          node -e "
            const log = require('fs').readFileSync('playwright-run.log', 'utf8');
            const num = (re) => { const m = log.match(re); return m ? Number(m[1]) : 0; };
            const passed = num(/(\d+)\s+passed/);
            const skipped = num(/(\d+)\s+skipped/);
            const failed = num(/(\d+)\s+failed/);
            const hasSummary = /(\d+)\s+passed/.test(log);
            const MIN_PASSED = 32;
            const problems = [];
            if (!hasSummary) problems.push('日志里没有 N passed 汇总行：E2E 未跑完或 reporter 形态已变（原实现会把它读成 0 并通过）');
            if (passed < MIN_PASSED) problems.push('通过数 ' + passed + ' 低于下界 ' + MIN_PASSED + '：旅程被静默裁剪？');
            if (skipped > 0) problems.push('存在被跳过的旅程：' + skipped + '（期望 0，视为门禁失败）');
            if (failed > 0) problems.push('存在失败旅程：' + failed);
            if (problems.length) {
              problems.forEach((p) => console.error('E2E 门禁失败 - ' + p));
              process.exit(1);
            }
            console.log('E2E 门禁通过：passed=' + passed + '（下界 ' + MIN_PASSED + '） skipped=0');
          "

      # 刻意不上传 playwright-report/（安全审计 #9）：失败 trace（playwright.config.js
      # 的 trace: retain-on-failure）嵌有管理员界面的 DOM 与 localStorage 里的 JWT，
      # 而公开仓库的 workflow artifact 匿名即可下载——等于把管理员会话态交给任何路过的人。
      # trace 仍按原样落在 runner 本地 outputDir（test-results/）供失败取证；本地跑同栈后
      # 用 `npx playwright show-report` 查看 HTML 报告。

  build:
    # I-M2：镜像构建/推送串联 e2e、secret-scan 与 security-audit——
    # 此前仅 needs:test，gitleaks 检出泄漏时含泄漏内容的镜像仍会推上 GHCR。
    # 评价报告 #3：追加 frontend-build——Dockerfile 只执行前端 build，
    # 前端 lint 或 vitest 覆盖率失败时，含缺陷前端的镜像不得推送到 GHCR。
    needs: [test, e2e, e2e-browser, secret-scan, security-audit, frontend-build]
    runs-on: ubuntu-latest
    # main 分支推 latest；v* 标签发布版本镜像（R-7）
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    # job 级 permissions 覆盖工作流级顶层（顶层 contents: read 只读兜底）：
    # 本 job 真正需要这两个写作用域，未列出的其余作用域仍然为 none。
    permissions:
      contents: read
      packages: write # GHCR 推送所需
      id-token: write # P2-⑩：cosign keyless 签名需要 OIDC 令牌（sigstore 无键签名）

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # R-7：登录 GitHub Container Registry（使用工作流内置 GITHUB_TOKEN，
      # 无需额外仓库密钥；镜像默认私有，按需在同仓库设置可见性）
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 版本 tag 策略：
      #   - 任意构建：:sha-<短哈希>（可精确回溯提交）
      #   - main 分支：额外 :latest
      #   - v* 标签：额外 :<标签名>（如 :v1.0.0）与 :latest
      - name: Compute image tags
        id: meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGS="${IMAGE}:sha-${GITHUB_SHA::7}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAGS="${TAGS},${IMAGE}:${GITHUB_REF_NAME},${IMAGE}:latest"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      # 构建时间戳：用于 OCI created 标签。单独成步而不在 build-args 里写
      # `${{ ... }}` 的 date：Actions 内置上下文没有“当前时间”（只有事件时间戳，
      # 重跑时会变成旧值）。UTC + ISO8601 是 OCI 规范对 created 的要求。
      - name: Compute build date
        id: builddate
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # 不传就会落到默认值 unknown——镜像看不出对应哪个 commit、何时构建。
          # sha 用全量（与 tag 的短哈希不同，全量可直接对回 git 对象）。
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.builddate.outputs.date }}
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          # P2-⑩：SLSA provenance 证明（构建来源与参数随镜像一同入 GHCR）
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # P2-⑩：SBOM（CycloneDX）——供应链可追溯的最低配套。
      # 从刚推送的镜像生成并作为构建产物上传：漏洞影响评估时按 SBOM 对账依赖树，
      # 而不是去猜基础镜像里装了什么。
      - name: Generate SBOM (CycloneDX)
        # v0 是移动 tag，实测指向 main 上未发布的提交；按仓库「钉 digest」标准钉到
        # 最新发布的补丁 tag commit（上游再发版时显式改这里，而非被动跟随移动 tag）。
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          artifact-name: sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error

      # P2-⑩：cosign keyless 签名（Fulcio 短期证书，无长命签名密钥需托管）。
      # 验签方：deploy.yml 的 preflight（cosign verify <image>@<digest>
      #   --certificate-identity-regexp <本仓库 ci.yml 的工作流 ref>
      #   --certificate-oidc-issuer https://token.actions.githubusercontent.com），
      # 并以解析出的 digest 钉死引用部署——只签不验等于没签。
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          # 复用 steps.meta 的 image 输出，不在这里重拼一次 `ghcr.io/${{ github.repository }}`：
          # 上面 Compute image tags 走的是 `${GITHUB_REPOSITORY,,}`（小写化），而 GitHub 仓库名
          # 允许大写字母。OCI 参考格式规定 repository 段必须小写，所以大写形态下这一步会以
          # "invalid reference format" 失败——签名步骤整条断掉，而它前面 SBOM 用的又是小写输出，
          # 于是"构建成功、SBOM 成功、签名红"。同一个镜像名在一条流水线里只允许有一个来源。
          IMAGE: ${{ steps.meta.outputs.image }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
