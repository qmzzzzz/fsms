name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Node 18 于 2025-04 EOL，仍保留做兼容性验证（2026-09-15 应要求恢复）：
        # 此前两类失败——时区断言（内嵌 +08:00 已修）与 teardown 后静默
        # exit 1（--forceExit 已治理）——均已闭合，公开仓额度不再是约束。
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          # 缓存两份 lockfile（后端与 web-admin）：下方两次 npm ci 都受益
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 体积预算的端到端断言（src/tests/deploy/bundleBudget.test.js 的「真实产物」部分）
      # 需要真实的 web-admin/dist；而 dist 是构建产物、已被 .gitignore 排除，CI 上不存在。
      # 该用例组**刻意不静默跳过**（那会让门禁在最需要它的场景变绿），
      # 因此这里真构建一次，使断言在 CI 上同样成立。
      - name: Build frontend (bundle budget tests need real dist)
        run: |
          npm --prefix web-admin ci
          npm --prefix web-admin run build

      - name: Run lint
        run: npm run lint

      # O-3 体积棘轮：max-lines / max-lines-per-function 以 warn 级接入，
      # 逐文件计数对照 eslint.ratchet.json 基线——任何文件 warn 计数只许降
      # 不许升（瘦身生效后本地 --update-baseline 收紧并随提交评审）
      - name: Run lint ratchet (size baseline)
        run: npm run lint:ratchet

      # O-12 格式门禁：源码区（src/、web-admin/src/ 等）必须符合 .prettierrc，
      # 本地用 `npm run format` 一键修复；check 失败即 CI 失败
      - name: Run format check (prettier)
        run: npm run format:check

      # --forceExit：2026-09-15 CI 实证（4 轮 × Node 18/20/22），测试 1754 全过、
      # globalTeardown 成功后约 130ms 进程静默 exit 1、无任何错误输出——
      # mongodb-memory-server 子进程句柄与 jest 主进程退出的清理竞态，本地
      # （Win/GMT+8/Node 22/20）始终 exit 0 无法复现。teardown 完成即代表
      # 全部断言已通过且数据库已清理，forceExit 仅绕过退出阶段的悬挂句柄，
      # 不影响测试语义。--watch 场景不兼容 forceExit，但 CI 无 watch。
      - name: Run tests
        run: npm test -- --forceExit
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret
          AES_SECRET_KEY: test-aes-key-32-chars-minimum!!
          HMAC_SECRET: test-hmac-secret

      # 顺序无关门禁（2026-09-18 新增）：本仓库的测试曾隐含「用例/文件按固定顺序执行」
      # 的未声明前提——固定顺序全绿、加 --randomize 则 12 个套件转红。这类回归
      # 极隐蔽：CI 此前只跑固定顺序，破坏顺序无关性的改动（新增共享模块级状态、
      # 跨用例复用造数、jest.resetModules 污染全局注册表…）在 CI 上永远绿灯，
      # 直到某次无关改动改变了文件/用例的执行次序才突然爆发，且极难定位。
      # 此门禁用固定 seed 跑一轮随机顺序：seed 固定 → 结果可复现（不是抽奖式门禁），
      # 又足以覆盖与默认顺序不同的排列。
      #
      # 2026-09-18 起跑**两个** seed：单 seed 只能证明"这一种排列"通过，而顺序耦合
      # 是概率性的——当天实测两个真实耦合都在默认 seed 下隐身、换 seed 才红：
      #   seed 777001 → assignRoles 三条用例共用一个 victim，"放行"那条把 level 6
      #                  角色写进去后，目标侧层级闸抢在 B-2/P2-8 前面拦下请求；
      #   seed 31337  → infraHardening 全文件共用 config/swagger 的 docsLimiter
      #                  模块级单例，跑满 429 的用例让后续用例的 200 变 429。
      # 两处都已修（前者按用例重置起点，后者进入前清自己的键），seed 也保留在
      # 这里当回归样本：再引入共享状态型耦合，这两个排列会替我们抓到。
      - name: Test order independence (randomized)
        run: |
          fail=0
          for seed in 20260917 31337; do
            echo "::group::jest --randomize --seed=$seed"
            npx jest --randomize --seed="$seed" --forceExit || fail=1
            echo "::endgroup::"
          done
          exit "$fail"
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret
          AES_SECRET_KEY: test-aes-key-32-chars-minimum!!
          HMAC_SECRET: test-hmac-secret

      - name: Run tests with coverage
        run: npm run test:coverage --if-present -- --forceExit
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret
          AES_SECRET_KEY: test-aes-key-32-chars-minimum!!
          HMAC_SECRET: test-hmac-secret

      - name: Upload backend coverage
        if: matrix.node-version == '22.x'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          # 配置 CODECOV_TOKEN 后上传即生效；未配置时私有仓上传必然失败，
          # 保持软门禁（覆盖率棘轮的真实门禁在上一步 jest --coverage 阈值）
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  security-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x

      - name: Audit backend dependencies
        # I-M3：取消 continue-on-error——高危依赖告警直接让 job 失败（硬门禁）；
        # 结果写入 Job Summary 留痕（此前软门禁会静默吞掉告警，事后无法追溯）
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=moderate | tee audit-backend.txt
          echo "### Backend npm audit" >> "$GITHUB_STEP_SUMMARY"
          tail -3 audit-backend.txt >> "$GITHUB_STEP_SUMMARY" || true

      - name: Audit web-admin dependencies
        working-directory: web-admin
        # I-M3：同上，硬门禁 + 留痕
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=moderate | tee ../audit-web.txt
          echo "### Web-admin npm audit" >> "$GITHUB_STEP_SUMMARY"
          tail -3 ../audit-web.txt >> "$GITHUB_STEP_SUMMARY" || true

  secret-scan:
    runs-on: ubuntu-latest

    # 本仓库的默认工作流权限是「仅 contents/packages 只读」这一档，未显式声明的
    # 作用域一律为 none。gitleaks 在 pull_request 事件下要调
    # GET /repos/{owner}/{repo}/pulls/{n}/commits 推导扫描范围，
    # 缺 pull-requests: read 会以 403「Resource not accessible by integration」
    # 让 job 直接失败——2026-09-11 CI 实证（全部 dependabot PR 的 secret-scan 全红）。
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # push 事件下 action 的 baseRef 推导有个硬伤：它取 eventJSON.commits[0].id
      # 再拼成 `<base>^..<head>`（^ 是硬编码的）。首次推送/新建分支时 commits[0]
      # 正是**根提交**，`root^` 不存在，gitleaks 报 "stderr is not empty" 退出 1，
      # 而扫描字节数是 0——门禁红了但等于没扫（最坏情况：红绿都不可信）。
      # BASE_REF 是 action 官方支持的覆盖项，这里改用它，并针对新建分支
      # （event.before 为 40 个 0）退一格取「根提交之后的第一个提交」，
      # 使范围变为 root..head 且可解析，覆盖本次推送的全部非根提交。
      # 仅 push 事件生效：pull_request 事件必须留空，否则会覆盖 action 自己的
      # PR 范围推导（那段逻辑是对的，不要动）。
      - name: Resolve gitleaks base ref
        id: gitleaks-base
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          ref="${{ github.event.before }}"
          if [ -z "$ref" ] || [ "$ref" = "0000000000000000000000000000000000000000" ]; then
            root="$(git rev-list --max-parents=0 HEAD)"
            ref="$(git rev-list --first-parent --reverse "$root..HEAD" | head -n 1)"
            # 单提交仓库（root 即 HEAD）无「根之后的提交」可退，退化扫 tip 提交
            [ -n "$ref" ] || ref="$(git rev-parse HEAD)"
          fi
          echo "gitleaks base ref => $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Run Gitleaks
        # v3（2026-05 发布）仅迁移运行时 Node 20 → 24，输入/输出/行为均无变化
        # （官方 README「Migrating from v2 to v3」：no changes to inputs, outputs, or behavior），
        # 当年保守保留 v2 的顾虑（输入契约变化）已不成立，一行升级即可。
        # 时间线：2026-06-02 起 runner 默认 Node 24（v2 已报警告）；
        # 2026-09-16 Node 20 从 runner 彻底移除，v2 无条件失效——必须升 v3。
        # 个人账号仓库无需 GITLEAKS_LICENSE（仅组织仓库需要）。
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # push 事件下显式传入解析好的 base ref（见上：覆盖 action 的根提交硬伤）
          BASE_REF: ${{ steps.gitleaks-base.outputs.ref }}

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Node 24：web-admin 锁定的 jsdom 30 依赖 undici 8.10.0，其内置 webidl
      # 直接调用 worker_threads.markAsUncloneable（Node 22.10+ 才有），
      # Node 20 下 jsdom 加载即崩、全部 worker 起不来（2026-09-05 CI 实证）
      - name: Use Node.js 24.x
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: web-admin/package-lock.json

      - name: Install dependencies
        working-directory: web-admin
        run: npm ci

      # 七维终评（代码质量）补门禁：前端 ESLint 与后端 lint 同级硬门禁。
      # 此前仅本地有 lint:web 脚本而 CI 未跑，前端代码风格/错误靠自觉；
      # 放在测试与构建之前，尽早拦截（当前基线已验证可通过）
      - name: Run frontend lint
        working-directory: web-admin
        run: npm run lint

      # T-3：前端测试 + 覆盖率硬门禁（vitest coverage.thresholds 低于基线即非零退出）
      - name: Run frontend tests with coverage
        working-directory: web-admin
        run: npm run test:coverage

      # 顺序无关门禁（前端，2026-09-18 新增，与后端同名步骤对称）：
      # 后端曾出现 12 个套件依赖固定执行顺序的隐患（见 test job 内说明），
      # 前端同样存在模块级共享状态（sessionStorage、document.documentElement.lang、
      # i18n 单例 locale、ResizeObserver 全局替身等），文件顺序一变就可能互相污染。
      # 此前的 frontend 只跑默认顺序，这类问题在 CI 上永远绿灯。
      # seed 固定 → 结果可复现（非抽奖式门禁），又与默认顺序构成不同排列。
      - name: Frontend test order independence (shuffled)
        working-directory: web-admin
        run: npx vitest run --sequence.shuffle --sequence.seed=20260918

      - name: Build frontend
        working-directory: web-admin
        run: npm run build

      # 体积预算硬门禁（七维终评补）：vite 的 chunkSizeWarningLimit 只是构建期警告，
      # 不阻断构建——误引入大依赖、manualChunks 规则失效、PWA 预缓存膨胀，
      # 都会让 CI 全绿而用户端首屏变慢。这一步把体积变成硬门禁（超预算即非零退出），
      # 必须紧跟在 build 之后——它的断言对象就是 dist/。
      - name: Check frontend bundle budget
        working-directory: web-admin
        run: npm run build:budget

      - name: Upload frontend coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./web-admin/coverage/lcov.info
          # 同后端口径：配置 CODECOV_TOKEN 后上传即生效，未配置时尽力而为；
          # 真实覆盖率门禁在上一步 vitest coverage.thresholds
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  e2e:
    # I-L6：E2E 冒烟 + 生产模式演练接入 CI。这一层走 index.js 完整启动序列
    # （dotenv→强校验→密钥注入→播种→监听→WebSocket/调度器/审计缓冲），
    # 是 supertest 套件测不到的接线层兜底；prod-drill 另验生产门禁。
    # 两脚本自带随机强密钥与内存 Mongo，无需额外 service 容器。
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm ci

      - name: Run E2E smoke（完整启动序列 14 步）
        run: npm run test:e2e

      - name: Run production drill（生产模式演练 9 步）
        run: npm run test:prod-drill

  e2e-browser:
    # 评价报告 H1：浏览器旅程为发布镜像硬门禁。桌面与移动端旅程
    # 已在本地真实栈稳定通过；MFA 旅程继续按环境能力跳过。
    runs-on: ubuntu-latest

    services:
      mongo:
        # 评价报告 #18：mongo 版本口径统一到生产 compose 的钉版 6.0.20
        image: mongo:6.0.20
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies and build
        run: |
          npm --prefix web-admin ci
          npm --prefix web-admin run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start full stack
        id: full-stack
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/fsms_browser_e2e
          LOGIN_CAPTCHA_ENABLED: 'false'
          ALLOW_PUBLIC_REGISTRATION: 'false'
        run: |
          E2E_TEST_PASSWORD="E2e!$(openssl rand -hex 12)Aa1"
          # 评价报告 #16：MFA 旅程固定种子（base32，RFC 4648 测试向量式占位）
          E2E_MFA_SEED="JBSWY3DPEHPK3PXP"
          # AES 密钥生成一次，服务端与 MFA 种子加密脚本共用（否则密文解不开）
          E2E_AES_KEY="$(openssl rand -hex 32)"
          export E2E_TEST_PASSWORD
          NODE_ENV=development \
          PORT=3000 \
          SERVE_FRONTEND=true \
          MONGODB_URI="$MONGODB_URI" \
          JWT_SECRET="$(openssl rand -hex 32)" \
          JWT_REFRESH_SECRET="$(openssl rand -hex 32)" \
          AES_SECRET_KEY="$E2E_AES_KEY" \
          HMAC_SECRET="$(openssl rand -hex 32)" \
          ADMIN_INITIAL_PASSWORD="$E2E_TEST_PASSWORD" \
          LOGIN_CAPTCHA_ENABLED="$LOGIN_CAPTCHA_ENABLED" \
          ALLOW_PUBLIC_REGISTRATION="$ALLOW_PUBLIC_REGISTRATION" \
          CORS_ORIGIN=http://127.0.0.1:3000 \
          LOG_LEVEL=warn \
          node src/index.js > logs-browser-e2e-backend.log 2>&1 &
          echo "$!" > browser-e2e-backend.pid
          echo "password=$E2E_TEST_PASSWORD" >> "$GITHUB_OUTPUT"
          echo "mfa-seed=$E2E_MFA_SEED" >> "$GITHUB_OUTPUT"

          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/readyz >/dev/null; then
              # 评价报告 #16：MFA 旅程用独立账号 mfa-e2e（固定种子）——
              # 不动 admin：否则其余旅程的登录会被 MFA 墙挡住。
              # 密码用 bcrypt 落库（经 User 模型预存钩子），种子存 AES 密文。
              AES_SECRET_KEY="$E2E_AES_KEY" JWT_SECRET="$E2E_AES_KEY" HMAC_SECRET="$E2E_AES_KEY" \
              E2E_MFA_PASSWORD="$E2E_TEST_PASSWORD" node -e "
                const mongoose = require('mongoose');
                (async () => {
                  await mongoose.connect(process.env.MONGODB_URI);
                  const User = require('./src/models/User');
                  const Role = require('./src/models/Role');
                  const { encryptMfaSecret } = require('./src/utils/mfaSecret');
                  const role = await Role.findOne({ code: 'SUPER_ADMIN' });
                  if (!role) throw new Error('SUPER_ADMIN 角色未播种');
                  let u = await User.findByUsername('mfa-e2e');
                  if (!u) {
                    u = await User.create({
                      username: 'mfa-e2e',
                      email: 'mfa-e2e@example.com',
                      password: process.env.E2E_MFA_PASSWORD,
                      roles: [role._id],
                      status: 'active',
                    });
                  }
                  const enc = encryptMfaSecret('$E2E_MFA_SEED');
                  await User.updateOne(
                    { _id: u._id },
                    { \$set: { mfaEnabled: true, mfaSecret: enc, mfaLastCounter: 0, status: 'active' } }
                  );
                  console.log('mfa-e2e seeded');
                  await mongoose.disconnect();
                })().catch((e) => { console.error(e); process.exit(1); });
              "
              exit 0
            fi
            sleep 1
          done
          cat logs-browser-e2e-backend.log
          exit 1

      - name: Run browser journeys
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_USER: admin
          E2E_PASS: ${{ steps.full-stack.outputs.password }}
          # 评价报告 #16：MFA 旅程用独立账号 mfa-e2e——种子在上一环节点脚本
          # 写入该账户（AES 密文），TOTP 码由 journey 内按种子实时生成
          E2E_MFA_USER: mfa-e2e
          E2E_MFA_PASS: ${{ steps.full-stack.outputs.password }}
          E2E_MFA_SECRET: ${{ steps.full-stack.outputs.mfa-seed }}
        run: |
          set -o pipefail
          npm run test:e2e:browser -- --workers=1 --project=desktop-chromium --project=mobile-chrome 2>&1 | tee playwright-run.log

      - name: Assert no skipped journeys
        # 评价报告 #16：E2E 曾可全量跳过且 CI 全绿（「0 执行也绿」的假门禁）。
        # 凭据与 MFA 种子均已注入，此处断言 skipped==0，防回归为按缺省静默跳过
        run: |
          node -e "
            const log = require('fs').readFileSync('playwright-run.log', 'utf8');
            const m = log.match(/(\d+)\s+skipped/);
            const skipped = m ? Number(m[1]) : 0;
            if (skipped > 0) {
              console.error('E2E 存在被跳过的旅程：' + skipped + '（期望 0，视为门禁失败）');
              process.exit(1);
            }
            console.log('skipped=0 校验通过');
          "

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  build:
    # I-M2：镜像构建/推送串联 e2e、secret-scan 与 security-audit——
    # 此前仅 needs:test，gitleaks 检出泄漏时含泄漏内容的镜像仍会推上 GHCR。
    # 评价报告 #3：追加 frontend-build——Dockerfile 只执行前端 build，
    # 前端 lint 或 vitest 覆盖率失败时，含缺陷前端的镜像不得推送到 GHCR。
    needs: [test, e2e, e2e-browser, secret-scan, security-audit, frontend-build]
    runs-on: ubuntu-latest
    # main 分支推 latest；v* 标签发布版本镜像（R-7）
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write # GHCR 推送所需

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # R-7：登录 GitHub Container Registry（使用工作流内置 GITHUB_TOKEN，
      # 无需额外仓库密钥；镜像默认私有，按需在同仓库设置可见性）
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 版本 tag 策略：
      #   - 任意构建：:sha-<短哈希>（可精确回溯提交）
      #   - main 分支：额外 :latest
      #   - v* 标签：额外 :<标签名>（如 :v1.0.0）与 :latest
      - name: Compute image tags
        id: meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGS="${IMAGE}:sha-${GITHUB_SHA::7}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAGS="${TAGS},${IMAGE}:${GITHUB_REF_NAME},${IMAGE}:latest"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      # 构建时间戳：用于 OCI created 标签。单独成步而不在 build-args 里写
      # `${{ ... }}` 的 date：Actions 内置上下文没有“当前时间”（只有事件时间戳，
      # 重跑时会变成旧值）。UTC + ISO8601 是 OCI 规范对 created 的要求。
      - name: Compute build date
        id: builddate
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # 不传就会落到默认值 unknown——镜像看不出对应哪个 commit、何时构建。
          # sha 用全量（与 tag 的短哈希不同，全量可直接对回 git 对象）。
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.builddate.outputs.date }}
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
