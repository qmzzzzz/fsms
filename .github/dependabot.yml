version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    # 把开发依赖的小版本/补丁更新合并成一个 PR，减少 PR 噪音；
    # 大版本更新仍逐个开 PR，便于逐条评估破坏性变更。
    groups:
      dev-minor-patch:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'npm'
    directory: '/web-admin'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'frontend'
    groups:
      dev-minor-patch:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'ci'

  # Dockerfile、docker-compose.yml 与 .github/workflows/ci.yml 的 service 容器里共 6 个
  # 第三方镜像引用（node:22.14.0-alpine / mongo:6.0.20 / prom/prometheus:v2.53.0 /
  #  prom/alertmanager:v0.27.0 / grafana/grafana:11.1.0 / redis:7-alpine），
  # 全部是「精确版本号 + registry digest」（`name:tag@sha256:<64hex>`）：钉版本保证可复现，
  # 钉 digest 保证这个 tag 被人改指向别的字节时也不会漂——代价是**不会自动漂向修复版**，
  # 基础镜像爆出 CVE 只能靠外部探测。交给 Dependabot 每周发现，它提的 PR 会同时改 tag 与 digest。
  #
  # 升级时还有第三处要一起改：`scripts/verify-image-digests.js` 的期望表（digest 的取证记录）。
  # 漏改任何一边都由 `src/tests/security/imageReferenceInventory.test.js` 判红——
  # 它按文件扫真实引用，再与期望表逐条对账，所以"文件改了、表没改"和"表改了、文件没改"都是红的。
  #
  # 用 docker 而非 docker-compose：两者在上游是不同 ecosystem，但 docker 的
  # file_fetcher/parser 同时处理 Dockerfile 与 YAML（YAML_REGEXP 会匹配
  # docker-compose.yml 这类非点号开头的 .yml），并递归提取 YAML 里的 image: 字段。
  # 单独再配一份 docker-compose 只会对同一批文件重复开 PR。
  #
  # 注意 `${APP_IMAGE:-fire-safety-app:local}` 是本地构建产物、非外部依赖，
  # 解析不出 registry 引用，Dependabot 会自然跳过。
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'docker'
