# ============================================================
# Prometheus 抓取配置（G-2：/metrics 消费端）
#
# 后端 /metrics 已是 Prometheus 文本格式（src/utils/metrics.js，
# 零依赖自实现），本文件把它接入正式抓取链路：
#   - app:3000 容器网络内直连，无需经宿主 nginx
#   - route 标签是路由模板（低基数），不会撑爆时序库
#
# 告警规则见同目录 alert-rules.yml（由 rule_files 装载）。
# 告警触达：已接入 Alertmanager（同目录 alertmanager.yml，docker-compose
# 的 alertmanager 服务）——critical/warning 均按 severity 路由到通知
# 通道，不再依赖人工盯 /alerts 页。接收器敏感项为占位，生产注入方式
# 见 alertmanager.yml 头注释。
# ============================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

# 告警结果推送至 Alertmanager（compose 服务名即主机名，9093 为容器内端口）
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: xf-app
    metrics_path: /metrics
    # /metrics 的应用层鉴权（src/middleware/metricsAuth.js）：
    # 容器内直连 `app:3000` 的 socket 对端是私网地址 ⇒ 零配置放行，本文件无需令牌。
    # 若 METRICS_TOKEN 已配置且抓取路径穿过反代/跨网段（或将来收窄私网放行），
    # 在 app 服务挂载同一份 secret 后加：
    #   bearer_token_file: /run/secrets/metrics_token
    # 令牌只从文件读——不要写进本文件（本文件随仓库分发）。
    static_configs:
      # compose 服务名即主机名；3000 为容器内端口。
      # 两色都要抓：切流后旧色被停、新色接管，只列 app 会让升级完成的那一刻
      # 指标全部消失（up=0），而告警已改成「两色都抓不到」才红（见 alert-rules.yml）。
      # 平时 app-green 不在运行，它那条 up=0 是预期状态，不是故障。
      - targets: ['app:3000', 'app-green:3000']
        labels:
          service: fire-safety-backend
