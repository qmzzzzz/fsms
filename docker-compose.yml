services:
  app:
    # 镜像来源（R-7 / D-1）：CI 已把带版本 tag 的镜像推到 GHCR，但此处原先只写
    # `build: .`——**推送出去的镜像从未被部署消费**，发布链在「推送」与「部署」
    # 之间断开：生产机上跑的是本地构建的未版本化镜像，无法回答「线上是哪个 commit」。
    #
    # 现改为「变量指定镜像 + 保留 build 供本地开发」：
    #   生产部署：APP_IMAGE=ghcr.io/<owner>/<repo>:sha-abc1234 docker compose pull app
    #             docker compose up -d --no-build app     # 明确不构建，用拉取的镜像
    #   本地开发：不设 APP_IMAGE，`docker compose build` 仍照常工作（tag 为默认值）
    #
    # 默认值故意不带 registry：本地构建产出留在本机，不会被误推到远端。
    # 生产必须显式给 APP_IMAGE（scripts/deploy.js 的 validatePreflight 会 fail-fast 校验）。
    image: ${APP_IMAGE:-fire-safety-app:local}
    build: .
    ports:
      # 仅绑定本机回环地址，生产由宿主 nginx 反向代理对外提供服务
      - '127.0.0.1:3000:3000'
    # P3-48：密钥不走 environment。容器环境变量不是机密载体——
    # `docker inspect` 完整回显 Config.Env、`docker compose config` 会把展开后的
    # 值打印到 CI 日志、子进程无条件继承、/proc/<pid>/environ 同 uid 可读。
    # 改用 secrets 挂载到 /run/secrets/<name>，应用侧由 config/secrets.js
    # 读取 <NAME>_FILE 指向的文件并注入（Docker/K8s 通用约定）。
    # 此处只保留非敏感配置项。
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      # 与下方 deploy.resources.limits.memory=1g 对齐：
      # V8 读不到 cgroup 限制，默认堆上限（约 1.5G）高于容器上限时，
      # 进程会先被 OOM Killer 杀掉而非触发 GC —— 表现为无日志的突然重启
      - NODE_OPTIONS=--max-old-space-size=768
      - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-1}
      - CORS_ORIGIN=${CORS_ORIGIN:?CORS_ORIGIN 必须显式配置（如 https://admin.example.com，多个用逗号分隔）}
      # Host 头白名单（生产必填，见 src/config/validate.js 的 collectAllowedHostsErrors）。
      # 本文件此前从未提供这一项，而 NODE_ENV=production 下缺失即**启动失败**——
      # 也就是照这份 compose 起的服务永远进不到监听阶段（部署链断裂）。
      # 与 CORS_ORIGIN 同用 `:?` 强制显式声明：给默认值等于把真实域名漏在门外。
      # 值为逗号分隔的 host（可带端口，如 fsms.example.com,api.example.com:443）；
      # 健康检查 /health 已在 protocolCompliance 的 skipPaths 中豁免，
      # 无需把 localhost 写进来。
      # /metrics 同理：Prometheus 按 `deployment/observability/prometheus.yml` 的 targets 直连
      # 容器服务名（Host: app:3000）抓取，该形态已由 HOST_GATE_EXEMPT_PATHS 单独豁免 Host 一项。
      # 别把 app:3000 加进本列表——那等于为了一条抓取链路把 Host 防线对整个站点放宽一档。
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?ALLOWED_HOSTS 必须显式配置（如 fsms.example.com，多个用逗号分隔）}
      # 审计留存天数（合规区间 90..3650，留空取默认 180）
      - AUDIT_RETENTION_DAYS=${AUDIT_RETENTION_DAYS:-180}
      # 指向挂载后的 secret 文件路径，本身不含敏感值
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - JWT_REFRESH_SECRET_FILE=/run/secrets/jwt_refresh_secret
      - AES_SECRET_KEY_FILE=/run/secrets/aes_secret_key
      - HMAC_SECRET_FILE=/run/secrets/hmac_secret
      - MONGODB_URI_FILE=/run/secrets/mongodb_uri
      - ADMIN_INITIAL_PASSWORD_FILE=/run/secrets/admin_initial_password
      # 登录口令传输加密的服务端静态私钥（src/utils/loginCipher.js，EC
      # P-256/P-384 PEM）。缺了它服务每次启动惰性生成临时密钥对：重启前的
      # 历史登录密文永久无法解密（流量取证须在重启前完成），
      # deployment/secret-rotation.md 里这把钥匙的轮换流程也从不生效。
      - LOGIN_ECDH_PRIVATE_KEY_FILE=/run/secrets/login_ecdh_private_key
      # 传输加密豁免（P2-⑧，src/config/validate.js 启动断言）：本 compose 的
      # mongo/redis 都在**同一宿主的 internal 数据面网络**内（2026-10-01 起与监控/
      # 边缘面分段，见文末 networks），流量不出网卡，明文可接受；redis 另有
      # requirepass（口令走 secrets，见下）。一旦拆分（分库部署/云托管实例），
      # 必须摘掉这两个旗标并改用 tls=true / rediss:——启动校验会替你把这件事
      # 拦成硬错误，而不是让数据先明文过网。
      - MONGODB_TLS_EXEMPT=true
      - REDIS_TLS_EXEMPT=true
      # 生产校验（src/config/validate.js）强制 REDIS_URL：限流共享计数、
      # IP 黑名单广播与审计链锁不得退化为单实例内存态。
      # 指向下方 redis 服务的容器网络别名，非敏感值，可明文置于 environment。
      - REDIS_URL=redis://redis:6379
      # Redis 认证（2026-10-01 审计 finding：redis 此前无任何认证）：口令经 secrets
      # 挂载（/run/secrets/redis_password），不进 environment；建连点
      # （sharedCache / websocketService）以 ioredis password 选项携带。
      # validate.js 生产闸：URL 凭据 / REDIS_PASSWORD / 显式豁免三者必居其一。
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
    secrets:
      - jwt_secret
      - jwt_refresh_secret
      - aes_secret_key
      - hmac_secret
      - mongodb_uri
      - admin_initial_password
      - login_ecdh_private_key
      - redis_password
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # ===== F-103：优雅关闭的部署侧契约（与代码侧总预算是同一份约定的两端）=====
    #
    # 此前本服务**没有** stop_grace_period ⇒ Docker/Compose 按默认 10 s 发 SIGKILL，
    # 而关停链最坏要 HTTP 10 s（存量请求排空）+ 设备扫描等待 30 s，
    # 排在链尾的两步——审计缓冲排空、Mongo 连接关闭——**一次都跑不到**，
    # 且强退不留任何日志线索（比"指标说谎"更糟：连谎话都没有）。
    # 现在代码侧由 src/utils/shutdownBudget.js 把整条链收进 SHUTDOWN_TOTAL_BUDGET_MS
    # （默认 25 s），这里给 30 s：差出的 5 s 留给日志 transport 落盘与 process.exit。
    # 两个数由 src/tests/utils/shutdownBudgetContract.test.js 钉在一起，改一侧必红。
    stop_grace_period: 30s
    # ===== R-4 容器加固：资源上限 + 日志轮转 =====
    #
    # 资源上限的意义不在于省资源，而在于**故障隔离**：没有上限时，
    # 一次内存泄漏或失控循环会把宿主机整台拖死（含 mongo 与宿主 nginx），
    # 一个进程的 bug 升级成全站不可用。
    #
    # 用 deploy.resources.limits 而非旧的顶层 mem_limit/cpus：
    # Compose V2 已把两者统一，deploy 段在 swarm 与 compose 下都生效。
    deploy:
      resources:
        limits:
          # Node 默认堆上限约 1.5G（64 位），容器给 1G 时 V8 感知不到限制，
          # 会在 OOM Kill 前才发现——因此下方 NODE_OPTIONS 同步收紧 --max-old-space-size
          memory: 1g
          cpus: '1.5'
        reservations:
          memory: 256m
    # 日志轮转：默认 json-file 驱动无上限，长跑容器的 stdout 会把磁盘写满，
    # 而磁盘满在本系统上表现为审计落库失败（WAL 也写不下）——安全能力静默退化
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    # 禁止通过 setuid 提权：容器内已是非 root（Dockerfile 的 USER nodejs），
    # 本项封住「进程内漏洞 → setuid 二进制 → root」这条路径
    security_opt:
      - no-new-privileges:true
    # 丢弃全部 Linux capability：本服务只监听 3000（非特权端口）、
    # 读写自己的 logs 目录，不需要任何 capability。
    # 保留一个不需要的 capability 就是给容器逃逸留一级台阶。
    cap_drop:
      - ALL
    # C-1：只读根文件系统。镜像内所有路径不可写，写入被收敛到两处：
    #   /app/logs —— 命名卷，winston 日志与审计 WAL（audit-buffer.wal）
    #   /tmp      —— tmpfs，node/依赖的临时文件
    # 任何「往镜像目录写文件」的漏洞利用（落地 webshell、篡改源码）
    # 都会被只读挂载直接挡下，且不需要应用改代码。
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - app-logs:/app/logs
    networks:
      # 双网络接入：fire-safety-net 承载监控抓取（prometheus→app:3000）与宿主发布的
      # 3000 端口，且 app 的出网能力（securityAlertDelivery 的 webhook）走这张网；
      # 只有 data-net 能摸到 mongo/redis——数据面与监控/边缘面隔离（2026-10-01 审计
      # finding：六服务共处一张扁平 bridge，Grafana 可配任意数据源 URL 直写无密码
      # redis）。见文末 networks 段。
      - fire-safety-net
      - data-net

  mongo:
    # R-5 基础镜像钉到 digest（2026-10-04 补齐：此前只钉到补丁号）
    #
    # 为什么至少要钉到补丁号：只写 `mongo:6` 时，tag 会随上游滚动，
    # 「同一份 compose 在两台机器上跑出不同的数据库版本」而无从察觉。
    #
    # 为什么补丁号还不够、要再钉 digest：tag 是**可变别名**，registry 可以在不打招呼的情况下
    # 把它指向另一批字节；钉 digest 之后「这份文件描述的镜像」才是唯一确定的那批内容。
    #
    # digest 不能凭记忆或推测填写（填错的现场是上线窗口才炸的 pull 失败）。本仓的取值口径：
    #   node scripts/verify-image-digests.js --only mongo:6.0.20
    # 它对 registry 的 manifest 端点**自算 sha256**（不是抄响应头），并要求运营主体不同的来源
    # 返回同一个值。2026-10-04 实测：public.ecr.aws + docker.m.daocloud.io + docker.1ms.run
    # 三源一致，取到的是 OCI index（7 个架构条目 ⇒ 按平台各自解析，钉的是同一份清单）。
    # 有 docker 守护进程的机器上也可以走另一条既有路径：`sh scripts/capture-image-digests.sh --apply`
    #（它 pull 之后把输出追加为 `image: mongo:6.0.20@sha256:<捕获值>`，两条路径产物同形）。
    # 保留可读 tag 而不是写纯 digest：纯 digest 看不出版本，排障时得先 inspect 才知道跑的是哪个大版本。
    image: mongo:6.0.20@sha256:eb5819129dee31a32982a940b6e32c9873fed05b5e938b65f802bb96dca8753d
    # 不暴露到宿主机，仅容器间通信（如需本地调试可临时改为 "127.0.0.1:27017:27017"）
    expose:
      - '27017'
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    # mongo 官方镜像原生支持 MONGO_INITDB_ROOT_PASSWORD_FILE，
    # 用它代替明文 environment（同样为了不出现在 docker inspect 中）
    environment:
      - MONGO_INITDB_DATABASE=fire_safety_db
      - MONGO_INITDB_ROOT_USERNAME_FILE=/run/secrets/mongo_root_username
      - MONGO_INITDB_ROOT_PASSWORD_FILE=/run/secrets/mongo_root_password
    secrets:
      - mongo_root_username
      - mongo_root_password
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    # R-4：mongo 同样加资源上限与日志轮转。
    # mongo 不设上限的后果比 app 更重：WiredTiger 默认把内存缓存开到
    # (宿主内存 - 1G) / 2，宿主内存越大它吃得越多，最终与 app 抢内存。
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2.0'
        reservations:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    security_opt:
      - no-new-privileges:true
    # C-1：只读根文件系统。数据与配置已各在命名卷（见上方 volumes），
    # 其余写入点用 tmpfs 兜住：
    #   /tmp            —— 常规临时文件
    #   /home/mongodb   —— mongosh 历史/缓存（healthcheck 会调 mongosh），
    #                      HOME 在镜像层，只读根下不给 tmpfs 会导致健康检查失败
    read_only: true
    tmpfs:
      - /tmp
      - /home/mongodb
    # 能力最小化：先 drop 全部，再精确补回官方镜像启动链必需的五项——
    # 入口脚本以 root 启动后经 gosu 降权到 mongodb（需要 SETUID/SETGID），
    # 首次初始化要对数据目录做属主调整（需要 CHOWN/DAC_OVERRIDE/FOWNER）。
    # 这与「不 drop」有本质区别：NET_RAW/SYS_ADMIN 等逃逸常用能力都已剥夺。
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    networks:
      # 只入数据面（internal 网络，见文末）：监控栈与宿主发布面都摸不到 mongo
      - data-net

  # ===== G-2 指标消费端：Prometheus 抓取 + Grafana 看板/告警 =====
  #
  # 后端 /metrics 已是 Prometheus 文本格式（src/utils/metrics.js），
  # 此前「采了没人看」；这些容器把它接成正式消费链路：
  #   - Prometheus：15s 抓取 + 告警规则求值（deployment/observability/alert-rules.yml）
  #   - Alertmanager：按 severity 路由推送通知（deployment/observability/alertmanager.yml），
  #     critical 即时触达、warning 低优先级，不再依赖人工盯 /alerts 页；
  #     接收器 URL 为占位，生产用私有副本挂载覆盖（不入库，见其头注释）
  #   - Grafana：预配置数据源与看板（deployment/observability/grafana/）
  # 三者都只绑 127.0.0.1：监控面不对外，访问经宿主反代或直接本机。
  prometheus:
    # R-5 同口径：digest 取自 scripts/verify-image-digests.js（对 manifest 字节自算 sha256、≥2 个独立运营来源一致、须为 manifest list）
    # 期望表在同脚本；scripts/capture-image-digests.sh 只认 node 与 mongo，第三方命名空间（prom/…、grafana/…）不走那条路。
    image: prom/prometheus:v2.53.0@sha256:075b1ba2c4ebb04bc3a6ab86c06ec8d8099f8fda1c96ef6d104d9bb1def1d8bc
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./deployment/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deployment/observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    depends_on:
      - app
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - fire-safety-net

  alertmanager:
    # G-2：告警触达链路的路由中枢（配置见 deployment/observability/alertmanager.yml，
    # 接收器 URL 为占位，生产以私有副本挂载覆盖，不入库）
    # R-5 同口径：digest 取自 scripts/verify-image-digests.js（对 manifest 字节自算 sha256、≥2 个独立运营来源一致、须为 manifest list）
    # 期望表在同脚本；scripts/capture-image-digests.sh 只认 node 与 mongo，第三方命名空间（prom/…、grafana/…）不走那条路。
    image: prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    ports:
      # 仅本机访问 Web UI；Prometheus 经容器网络 9093 推送告警
      - '127.0.0.1:9093:9093'
    volumes:
      - ./deployment/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    depends_on:
      - prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - fire-safety-net

  grafana:
    # R-5 同口径：digest 取自 scripts/verify-image-digests.js（对 manifest 字节自算 sha256、≥2 个独立运营来源一致、须为 manifest list）
    # 期望表在同脚本；scripts/capture-image-digests.sh 只认 node 与 mongo，第三方命名空间（prom/…、grafana/…）不走那条路。
    image: grafana/grafana:11.1.0@sha256:079600c9517b678c10cda6006b4487d3174512fd4c6cface37df7822756ed7a5
    ports:
      # 宿主 3000 已被 app 占用，Grafana 用 3001
      - '127.0.0.1:3001:3000'
    environment:
      # 初始管理员口令走宿主环境变量（同 CORS_ORIGIN 的强制显式约定）；
      # 首次登录后应立即在界面内更换
      # Grafana 官方镜像支持 Docker Secret 专用 __FILE 后缀，避免口令进入 environment
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deployment/observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deployment/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    secrets:
      - grafana_admin_password
    depends_on:
      - prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      # 官方镜像启动链需要这两处可写（日志默认走 stdout，目录仍要存在）
      - /var/log/grafana
      - /run/grafana
    networks:
      - fire-safety-net

  redis:
    # R-5 同口径：钉补丁号 + digest。P2-49：钉 digest（7-alpine 标签会随上游重建
    # 而漂移，无法复现同一镜像）。
    # digest 捕获与复验：2026-09-17 静态捕获 ff02b58f…（当时未经本机 docker pull 复核）；
    # 2026-10-01 复验发现 tag 已漂移（ff02b58f 是当时真实捕获的旧 manifest，
    # 按 digest 直取仍 200），当前指向经两条独立 registry 通道核验（daocloud
    # pull-through + AWS ECR Public，返回字节逐字节一致、本地自算 sha256 与
    # Docker-Content-Digest 相等，方法与 Dockerfile 的 node 钉版同源），同步更新为
    # 当前值。上线前仍可一条命令复验：
    #   docker pull redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    # 仅容器内网通信（app 以 redis://redis:6379 访问），不暴露宿主机端口
    expose:
      - '6379'
    # 认证（2026-10-01 审计 finding：redis 此前无任何认证，且与监控栈同网——
    # Grafana 任意数据源 URL 即一条无密码写路径：删黑名单键 = 撤销封禁、
    # 清限流计数 = 解除封顶）。requirepass 读自挂载的 secret 文件：口令不进
    # command 字面量（docker inspect 可见）、不进 environment；$$ 是 compose
    # 转义，容器内 shell 展开 $(cat …)。应用侧凭据由 REDIS_PASSWORD_FILE 注入
    # （见 app 服务与 sharedCache.redisConnectionPassword）。
    command:
      - /bin/sh
      - -c
      - 'exec redis-server --appendonly yes --requirepass "$$(cat /run/secrets/redis_password)"'
    secrets:
      - redis_password
    healthcheck:
      # requirepass 开启后 PING 会回 NOAUTH——必须带口令探测，且 grep -q PONG
      # 把「redis-cli 对错误回包退出 0」的口子堵死（NOAUTH 也算失败）
      test:
        [
          'CMD-SHELL',
          'redis-cli --no-auth-warning -a "$$(cat /run/secrets/redis_password)" ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
        reservations:
          memory: 64m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - redis-data:/data
    networks:
      # 只入数据面（internal 网络）：应用侧唯一，监控栈与宿主发布面都摸不到。
      # 有限流/封禁状态承载，上面还有无差别命令面——网络可达面必须最小。
      - data-net

# ============================================================
# 密钥文件（P3-48）
#
# 部署前准备（宿主机上执行一次，务必放在仓库之外的目录）：
#   mkdir -p ./secrets && chmod 700 ./secrets
#   # 首选：一次生成全套（mongodb_uri 的 userinfo 转义也自动处理，免手抄拼接）
#   node scripts/generate-secrets.js --out ./secrets
#   # 手抄版（与上面等价，逐条可控）：
#   openssl rand -base64 48 | tr -d '\n' > ./secrets/jwt_secret
#   openssl rand -base64 48 | tr -d '\n' > ./secrets/jwt_refresh_secret
#   openssl rand -hex 32     | tr -d '\n' > ./secrets/aes_secret_key
#   openssl rand -hex 16     | tr -d '\n' > ./secrets/hmac_secret
#   # 登录口令传输加密的服务端静态私钥（P-256 PEM；勿设 passphrase——
#   # 应用侧直接导入，不过口令）
#   openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out ./secrets/login_ecdh_private_key
#   # redis_password 用 -base64 即可：应用侧走 ioredis 的 password 选项（不进 URL
#   # userinfo），字符集不受 percent-encoding 约束
#   openssl rand -base64 32 | tr -d '\n' > ./secrets/redis_password
#   printf 'firesafety'  > ./secrets/mongo_root_username
#   # mongo_root_password 必须用 -hex：它要内嵌进 mongodb_uri 的 userinfo 段，
#   # 而 base64 字符集含 '/'（实测 32 字节 base64 约一半概率出现），驱动对未转义的
#   # '/' ':' '#' '?' 直接抛 "Password contains unescaped characters" ⇒ 应用启动即退出。
#   # 熵不变（两者都是 32 字节随机数），只是编码换 URL 安全集。
#   openssl rand -hex 32     | tr -d '\n' > ./secrets/mongo_root_password
#   openssl rand -base64 24 | tr -d '\n' > ./secrets/admin_initial_password
#   openssl rand -base64 32 | tr -d '\n' > ./secrets/grafana_admin_password
#   # mongodb_uri 需内嵌上面的用户名与口令：用户名/口令走的是 URL userinfo，
#   # 上面已把口令限制在 hex 字符集，因此这里可以直接拼接；若改用其它字符集
#   # （base64 等），必须先 percent-encode —— scripts/generate-secrets.js 就是走
#   # encodeURIComponent 那条路，两种写法都由用例把"拼出来的串必须被驱动接受"钉住。
#   printf 'mongodb://%s:%s@mongo:27017/fire_safety_db?authSource=admin' \
#     "$(cat ./secrets/mongo_root_username)" "$(cat ./secrets/mongo_root_password)" \
#     > ./secrets/mongodb_uri
#   chmod 600 ./secrets/*
#
# 为什么 mongodb_uri 单独成文件而不是在 compose 里拼接：
# 拼接需要在 compose 中引用口令变量，那口令就又回到了 environment/CLI 上。
#
# 注意 ./secrets 必须加入 .gitignore 与 .dockerignore（已确认在列）。
# 生产建议改用 docker swarm 的外部 secret 或云厂商 KMS：
#   secrets:
#     jwt_secret:
#       external: true
# ============================================================
secrets:
  jwt_secret:
    file: ./secrets/jwt_secret
  jwt_refresh_secret:
    file: ./secrets/jwt_refresh_secret
  aes_secret_key:
    file: ./secrets/aes_secret_key
  hmac_secret:
    file: ./secrets/hmac_secret
  mongodb_uri:
    file: ./secrets/mongodb_uri
  admin_initial_password:
    file: ./secrets/admin_initial_password
  # 登录口令信封加密的服务端静态私钥（EC P-256/P-384 PEM，勿设 passphrase）。
  # generate-secrets.js 与头注释手抄清单都产出该文件；文件缺失时 docker
  # compose 直接拒绝启动（与其余 secret 同契约），不会静默回退临时密钥。
  login_ecdh_private_key:
    file: ./secrets/login_ecdh_private_key
  mongo_root_username:
    file: ./secrets/mongo_root_username
  mongo_root_password:
    file: ./secrets/mongo_root_password
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  # Redis 认证口令（2026-10-01 审计 finding）：redis 侧 --requirepass 与 app 侧
  # REDIS_PASSWORD_FILE 共用这一份。生成命令见本文件头部注释块
  redis_password:
    file: ./secrets/redis_password

volumes:
  mongo-data:
  mongo-config:
  # R-6（#1）：Redis 持久化卷。限流共享计数、IP 黑名单广播与审计链锁依赖
  # Redis 存活；appendonly 开启时数据落此卷，重启不丢黑名单/计数状态。
  # 不备份——重启后可从 DB 重建，属可再生缓存（见 docs/adr/ADR-005）
  redis-data:
  # C-1：app 只读根下的日志卷（与 mongo 数据卷不同，日志可再生，
  # 灾难恢复时不需要它，但正常运行期必须持久（审计 WAL 在此）
  app-logs:
  # G-2：监控栈数据卷。prometheus-data / grafana-data 此前被服务引用
  # 却未在本段声明，docker compose config 会直接拒绝整个项目；
  # alertmanager-data 同理（静默/通知状态，重启不丢静默记录）
  prometheus-data:
  grafana-data:
  alertmanager-data:
  # redis-data:

networks:
  fire-safety-net:
    driver: bridge
  # ===== 数据面内网（2026-10-01 审计 finding：六服务共处一张扁平 bridge）=====
  # internal: true ⇒ 该网络不接宿主 NAT、不出外网；mongo / redis 只在此网络上，
  # 监控栈（prometheus / alertmanager / grafana）与宿主发布面（127.0.0.1:* 端口）
  # 均无法到达。app 双网络接入（fire-safety-net 出网 + 数据面）。
  # 这条分段直接封掉的反向路径：Grafana 数据源 URL 可配任意地址 ⇒ 原先可达
  # 无密码 redis（删黑名单键 = 撤销封禁、清限流计数 = 解除封顶）；
  # 同网任一容器被攻破即得 mongo 全量读写。
  data-net:
    driver: bridge
    internal: true
