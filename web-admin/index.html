<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#c1121f" />
    <!-- 内部管理系统防收录的第三层兜底（外两层：X-Robots-Tag 响应头 +
         public/robots.txt）：HTML 被挪到任何丢失响应头的托管环境时仍生效 -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="消防设备巡检、报警处理、安全管理系统" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="消防管理" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- 资源一律用根绝对路径（/xxx）：Vite 会在 dev/build 统一拼接 base，本身就是
         base 感知（--base=/admin/ 下产出 /admin/xxx）。勿改回「BASE_URL 占位符」写法：
         占位符先被 htmlEnvHook 展开成绝对路径、dev 下再被 devHtmlHook 二次拼接 base，
         子路径部署会变成 /admin/admin/... 而 404（vite 8.3.4 实测）。
         manifest 链接由 vite-plugin-pwa 按 base 自动注入，此处不手写（否则重复两个） -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <!-- 外链保证生产 CSP(script-src 'self') 也允许首帧主题脚本执行 -->
    <script src="/theme-bootstrap.js"></script>
    <title>消防安全管理系统</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- 入口脚本同上：根绝对路径由 Vite 按 base 重写，勿用 BASE_URL 占位符（见 head 注） -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
