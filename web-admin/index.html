<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#c1121f" />
    <!-- 内部管理系统防收录的第三层兜底（外两层：X-Robots-Tag 响应头 +
         public/robots.txt）：HTML 被挪到任何丢失响应头的托管环境时仍生效 -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="消防设备巡检、报警处理、安全管理系统" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="消防管理" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- 资源一律走 BASE_URL：子路径部署（/admin/）下根绝对路径会 404；
         manifest 链接由 vite-plugin-pwa 按 base 自动注入，此处不再手写（否则重复两个） -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.svg" />
    <!-- 外链保证生产 CSP(script-src 'self') 也允许首帧主题脚本执行 -->
    <script src="%BASE_URL%theme-bootstrap.js"></script>
    <title>消防安全管理系统</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
