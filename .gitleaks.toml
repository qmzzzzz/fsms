# gitleaks 只自动读取 `.gitleaks.toml`（带点号）；无点号的文件会被静默忽略，
# 门禁看起来配好了、实际仍在用默认规则（2026-10-25 CI 实证）。
# 只扩展默认规则并放行测试夹具里的固定假 token，不放宽任何真实凭据的检测。
[extend]
useDefault = true

# 全局允许清单是**单数表** `[allowlist]`（gitleaks 8.24 config.Config.Allowlist）。
# `[[allowlists]]` 只在 `[[rules]]` 下有效，写在全局会被静默忽略：配置看着配好了，
# 实际一条都没放行——2026-10-26 本地用 8.24.3 复扫实证。
[allowlist]
description = "测试夹具中的假凭据（webhook token / 口令密文），非真实凭据"
regexes = ['''0f1e2d3c4b5a6978''', '''ZmFrZS1lbnZlbG9wZQ==''']
