# gitleaks 只自动读取 `.gitleaks.toml`（带点号）；无点号的文件会被静默忽略，
# 门禁看起来配好了、实际仍在用默认规则（2026-10-25 CI 实证）。
# 只扩展默认规则并放行测试夹具里的固定假 token，不放宽任何真实凭据的检测。
[extend]
useDefault = true

[[allowlists]]
description = "测试夹具中的假 webhook token（dingtalk / 企业微信），非真实凭据"
regexes = ['''0f1e2d3c4b5a6978''']

[[allowlists]]
description = "测试夹具中的假口令密文（base64 明文 fake-envelope），非真实凭据"
regexes = ['''ZmFrZS1lbnZlbG9wZQ==''']
